name: "M031 — tests correction de visibilité du site"
on:
  push:
    branches: [feat/m031-audit-visibilite-d1-cycles-20261113]
permissions: {contents: read}
jobs:
  visibility:
    if: ${{ contains(github.event.head_commit.message, '[M031_TEST]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verifier compilation, publication, visibilité, droits
        run: |
          set -euo pipefail
          node scripts/build-m012b-member-spaces-inline.mjs --check
          node scripts/build-m019-editor-client.mjs --check
          node --check migration/cloudflare/editor-demo-client-source.js
          node --check migration/cloudflare/editor-server-draft-api.mjs
          node --test tests/test_m031_published_visibility.mjs tests/test_m030_canonical_celebrations.mjs tests/test_m012c_private_editor_publication.mjs tests/test-editor-demo.mjs tests/test-editor-publication-media.mjs
          echo M031_VISIBILITY_REGRESSIONS_PASS
