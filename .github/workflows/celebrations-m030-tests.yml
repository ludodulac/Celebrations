name: Célébrations M030 — contrat unique, tests sans déploiement
on:
  push:
    branches: [feat/m030-canonical-celebration-cycles-20261113]
permissions:
  contents: read
concurrency:
  group: celebrations-m030-canonical-unit-tests
  cancel-in-progress: false
jobs:
  verify-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Validate no-date, no-duplicate canonical celebration definitions
        run: |
          node --check migration/cloudflare/app/domain/celebration-cycle-registry.mjs
          node --test tests/test_m030_official_migration_worker.mjs tests/test_m030_canonical_celebrations.mjs tests/test_m012c_private_editor_publication.mjs
      - name: Verify canonical generated editor and existing functionality
        run: |
          node scripts/build-m012b-member-spaces-inline.mjs --check
          node scripts/build-m019-editor-client.mjs --check
          node --test tests/test_m029_navigation_title_only.mjs tests/test-editor-demo.mjs \
            tests/test_m021b_admin_mode.mjs tests/test_m003_localization.mjs \
            tests/test-editor-publication-media.mjs tests/test_m026_real_mp3_detection.mjs \
            tests/test_m025_mp3_multipart.mjs
      - name: Strictly no Cloudflare credentials or deployments
        run: echo M030_OFFLINE_ONLY_NO_PRODUCTION_WRITES
