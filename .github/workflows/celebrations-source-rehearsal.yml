name: Celebrations source and D1 offline rehearsal
on:
  push:
    branches: [fix/celebrations-programme-library-006]
    paths:
      - scripts/rehearse-staging-source.py
      - .github/workflows/celebrations-source-rehearsal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-read-only-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3'
      - name: Source counts, hash validation, relational D1 offline import, FK checks
        run: python -m scripts.rehearse-staging-source
