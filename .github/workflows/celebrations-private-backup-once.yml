      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
      PROD_D1_ID: 28736d2a-479b-472b-bf82-703ad0affe10
      CELEBRATIONS_ADMIN_PASSWORD: ${{ secrets.CELEBRATIONS_ADMIN_PASSWORD }}
    steps:
      - name: Block missing admin credential without creating a Worker or touching DNS
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/celebrations-supabase-exit-001"
          test "$PROD_D1_ID" != "$STAGING_D1_ID"
          test "$STAGING_R2_BUCKET" = "celebrations-exit-staging"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if [ "${#CELEBRATIONS_ADMIN_PASSWORD}" -lt 14 ]; then
