    # This temporary hostname is NOT the emailed historic hostname.
    if: ${{ github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && contains(github.event.head_commit.message, '[EDITABLE_PROD_ADMIN_QA_ONCE]') }}
    runs-on: ubuntu-latest
