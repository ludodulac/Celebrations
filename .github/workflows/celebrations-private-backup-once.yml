name: CÉLÉBRATIONS — sauvegarde source chiffrée unique (protégée)

# This workflow is deliberately opt-in. It only runs when a maintainer pushes
# a commit whose message contains [BACKUP_ENCRYPTED_ONCE] to the migration
# branch. This avoids workflow_dispatch's default-branch registration rule.
# Never run on PRs or on main. Only encrypted ciphertext goes to private R2.
on:
  push:
    branches:
      - feat/celebrations-supabase-exit-001

permissions:
  contents: read

concurrency:
  group: celebrations-private-source-backup
  cancel-in-progress: false

jobs:
  encrypted-backup:
    if: ${{ github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && contains(github.event.head_commit.message, '[BACKUP_ENCRYPTED_ONCE]') }}
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CELEBRATIONS_BACKUP_PASSPHRASE: ${{ secrets.CELEBRATIONS_BACKUP_PASSPHRASE }}
      BACKUP_FILE: /tmp/celebrations-source-only.cbackup
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
      STAGING_R2_ACCESS_KEY_ID: ${{ secrets.CELEBRATIONS_STAGING_R2_ACCESS_KEY_ID }}
      STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.CELEBRATIONS_STAGING_R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - name: Assert private, read-only, source-specific setup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REF" = "refs/heads/feat/celebrations-supabase-exit-001"
          test "${SUPABASE_URL%/}" = "https://jwyayfkssyagvnablttg.supabase.co"
          for key in SUPABASE_SERVICE_ROLE_KEY CELEBRATIONS_BACKUP_PASSPHRASE; do
            test -n "${!key:-}" || { echo "Missing required GitHub environment secret"; exit 1; }
          done
          test "${#CELEBRATIONS_BACKUP_PASSPHRASE}" -ge 32 || { echo "Backup secret too short"; exit 1; }
          test "$STAGING_R2_BUCKET" = "celebrations-exit-staging"
          for key in CLOUDFLARE_ACCOUNT_ID STAGING_R2_ACCESS_KEY_ID STAGING_R2_SECRET_ACCESS_KEY R2_ENDPOINT; do
            test -n "${!key:-}" || { echo "Missing private staging R2 credential"; exit 1; }
          done
          test ! -e "$BACKUP_FILE"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned encryption and Supabase HTTP dependencies
        run: python -m pip install 'cryptography==46.0.4' 'requests==2.32.5' 'boto3==1.40.57'
      - name: Export 16 approved source tables, encrypt and verify locally
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m migration.encrypted_backup --output "$BACKUP_FILE"
          python -m migration.encrypted_backup --verify "$BACKUP_FILE"
          test -s "$BACKUP_FILE"
          test "$(stat -c %a "$BACKUP_FILE")" = 600
          python - <<'PY'
          import os, pathlib
          path=pathlib.Path(os.environ["BACKUP_FILE"])
          data=path.read_bytes()
          assert data.startswith(b"CELEBRATIONS-DB-AESGCM-V1\x00")
          assert b"manifest.json" not in data
          print("Encrypted file present and verified; NO plaintext will be uploaded")
          PY
      - name: Save ONLY the ciphertext to private, isolated Cloudflare staging R2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, hashlib, os, pathlib, secrets
          from urllib.parse import urlsplit
          import boto3
          from botocore.config import Config

          assert os.environ["STAGING_R2_BUCKET"] == "celebrations-exit-staging"
          endpoint=os.environ["R2_ENDPOINT"].rstrip("/")
          parsed=urlsplit(endpoint)
          assert parsed.scheme=="https" and parsed.hostname==os.environ["CLOUDFLARE_ACCOUNT_ID"]+".r2.cloudflarestorage.com"
          assert not parsed.path, "Unexpected R2 endpoint path"
          p=pathlib.Path(os.environ["BACKUP_FILE"])
          data=p.read_bytes() # This holds only AES-GCM encrypted ciphertext.
          assert data.startswith(b"CELEBRATIONS-DB-AESGCM-V1\x00")
          name="private-backups/source-"+datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")+"-"+secrets.token_hex(12)+".cbackup"
          client=boto3.client("s3",endpoint_url=endpoint,region_name="auto",
            aws_access_key_id=os.environ["STAGING_R2_ACCESS_KEY_ID"],
            aws_secret_access_key=os.environ["STAGING_R2_SECRET_ACCESS_KEY"],
            config=Config(retries={"max_attempts":2,"mode":"standard"}))
          client.put_object(Bucket="celebrations-exit-staging",Key=name,
            Body=data,ContentType="application/octet-stream",
            CacheControl="private, no-store", Metadata={"encrypted":"aes256gcm","kind":"source-only"})
          remote=client.get_object(Bucket="celebrations-exit-staging",Key=name)["Body"].read()
          if hashlib.sha256(data).digest()!=hashlib.sha256(remote).digest():
            raise RuntimeError("Encrypted R2 backup verification failed")
          print("PRIVATE_R2_CIPHERTEXT_VERIFIED bucket=celebrations-exit-staging key="+name+
            " bytes="+str(len(data))+" plaintext_uploaded=0 D1_writes=0")
          PY
      - name: Remove encrypted temporary file from runner
        if: always()
        shell: bash
        run: rm -f "$BACKUP_FILE"


  isolated-restore-audit:
    # A separate single-shot trigger. Never create another source backup,
    # never write to R2, and never touch the production or staging D1.
    if: ${{ github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && contains(github.event.head_commit.message, '[VERIFY_BACKUP_RESTORE_ONCE]') }}
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 15
    env:
      CELEBRATIONS_BACKUP_PASSPHRASE: ${{ secrets.CELEBRATIONS_BACKUP_PASSPHRASE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
      STAGING_R2_ACCESS_KEY_ID: ${{ secrets.CELEBRATIONS_STAGING_R2_ACCESS_KEY_ID }}
      STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.CELEBRATIONS_STAGING_R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - name: Confirm restore audit is isolated from production and D1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/celebrations-supabase-exit-001"
          test "$STAGING_R2_BUCKET" = "celebrations-exit-staging"
          for secret_name in CELEBRATIONS_BACKUP_PASSPHRASE CLOUDFLARE_ACCOUNT_ID STAGING_R2_ACCESS_KEY_ID STAGING_R2_SECRET_ACCESS_KEY R2_ENDPOINT; do
            test -n "${!secret_name:-}" || { echo "Missing private restore prerequisite"; exit 1; }
          done
          test "${#CELEBRATIONS_BACKUP_PASSPHRASE}" -ge 32
          test -d /dev/shm
          mountpoint -q /dev/shm
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned minimal crypto and private-R2 read dependencies
        run: python -m pip install 'cryptography==46.0.4' 'boto3==1.40.57' 'requests==2.32.5'
      - name: Decrypt the previously saved ciphertext into RAM and restore SQLite locally
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m migration.verify_real_backup_restore

  media-manifest-audit:
    # Only an explicit migration-branch commit with the exact audit marker
    # can trigger this read-only inventory audit. No 830 MB recopy and no D1.
    if: ${{ github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && contains(github.event.head_commit.message, '[MEDIA_AUDIT_ONLY_ONCE]') }}
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
      STAGING_R2_ACCESS_KEY_ID: ${{ secrets.CELEBRATIONS_STAGING_R2_ACCESS_KEY_ID }}
      STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.CELEBRATIONS_STAGING_R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - name: Check staging-only read access and fixed source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/celebrations-supabase-exit-001"
          test "${SUPABASE_URL%/}" = "https://jwyayfkssyagvnablttg.supabase.co"
          test "$STAGING_R2_BUCKET" = "celebrations-exit-staging"
          for v in SUPABASE_SERVICE_ROLE_KEY CLOUDFLARE_ACCOUNT_ID STAGING_R2_ACCESS_KEY_ID STAGING_R2_SECRET_ACCESS_KEY R2_ENDPOINT; do
            test -n "${!v:-}" || { echo "Missing audit read credentials"; exit 1; }
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned read-only listing client dependencies
        run: python -m pip install 'requests==2.32.5' 'boto3==1.40.57'
      - name: Compare Supabase Storage originals with R2 staging key/size/times
        run: python scripts/audit_celebrations_media_dual_copy_readonly.py

  participant-verifier-parity:
    # Audit the historic account's mathematical password/recovery parity.
    # Never attempt a real login or modify existing sessions/lockout state.
    if: ${{ github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && contains(github.event.head_commit.message, '[PARTICIPANT_PARITY_ONLY_ONCE]') }}
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
    steps:
      - name: Refuse production scope or missing read credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/celebrations-supabase-exit-001'
          test "${SUPABASE_URL%/}" = "https://jwyayfkssyagvnablttg.supabase.co"
          test "$STAGING_R2_BUCKET" = 'celebrations-exit-staging'
          for v in SUPABASE_SERVICE_ROLE_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN STAGING_D1_ID; do
            test -n "${!v:-}" || { echo "Missing private participant-audit prerequisites"; exit 1; }
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check account-wide Cloudflare D1 daily quota WITHOUT a D1 SQL call
        run: node scripts/check-staging-d1-free-budget.mjs pre
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned read-only source and D1 HTTP dependency
        run: python -m pip install 'requests==2.32.5'
      - name: Compare exactly one source account to one staging hash verifier
        run: python scripts/audit_historic_participant_verifier_parity.py

  readiness-678-audit:
    # One real-time final staging read-only check + original Pages fallback.
    # Never deploy Cloudflare production, change DNS, sync source, or write D1.
    if: ${{ github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && contains(github.event.head_commit.message, '[READINESS_678_ONLY_ONCE]') }}
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
    steps:
      - name: Require exact isolated branch and staging bucket
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/celebrations-supabase-exit-001"
          test "$STAGING_R2_BUCKET" = "celebrations-exit-staging"
          for v in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN STAGING_D1_ID; do
            test -n "${!v:-}" || { echo "Missing staging read-only auditing prerequisite"; exit 1; }
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify total account D1 quota before any staging read
        run: node scripts/check-staging-d1-free-budget.mjs pre
      - name: STEP 6 — Verify live Cloudflare staging visitor content and privacy
        run: node scripts/verify-staging-final-readonly.mjs
      - name: STEP 8 — Check existing GitHub Pages fallback is still reachable
        run: node scripts/verify-legacy-rollback-baseline.mjs
      - name: STEP 7 — Check production candidate worker and local asset generation
        shell: bash
        run: |
          node --check migration/cloudflare/production-worker.mjs
          node --test tests/test-exit-production-candidate.mjs
          python scripts/build_production_assets.py
          grep -Fq "CELEBRATIONS_STAGING_BACKEND=location.origin" production-public/index.html
          grep -Fq "CELEBRATIONS_STAGING_BACKEND=location.origin" production-public/admin.html
          test ! -f migration/cloudflare/wrangler.production.toml
          echo "PRODUCTION_PREPARATION_OFFLINE_PASS deployment=NO dns_changes=0 separate_prod_resource_creation=NO"

  precutover-789-guarded-audit:
    # 7-8-9 preparation: inspect production resources, escrow DNS encrypted
    # when the domain's complete zone/routes can be read, and sync only
    # validated click deltas to isolated D1 staging. NOT a production cutover.
    if: ${{ github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && contains(github.event.head_commit.message, '[CUTOVER_789_PREFLIGHT_ONCE]') }}
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 27
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
      STAGING_R2_ACCESS_KEY_ID: ${{ secrets.CELEBRATIONS_STAGING_R2_ACCESS_KEY_ID }}
      STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.CELEBRATIONS_STAGING_R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      CELEBRATIONS_BACKUP_PASSPHRASE: ${{ secrets.CELEBRATIONS_BACKUP_PASSPHRASE }}
    steps:
      - name: Validate exact staging scope and protected required variables
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/celebrations-supabase-exit-001"
          test "$STAGING_R2_BUCKET" = "celebrations-exit-staging"
          test "${SUPABASE_URL%/}" = "https://jwyayfkssyagvnablttg.supabase.co"
          for v in SUPABASE_SERVICE_ROLE_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN STAGING_D1_ID STAGING_R2_ACCESS_KEY_ID STAGING_R2_SECRET_ACCESS_KEY R2_ENDPOINT CELEBRATIONS_BACKUP_PASSPHRASE; do
            test -n "${!v:-}" || { echo "Missing staging pre-cutover audit prerequisite"; exit 1; }
          done
          test "${#CELEBRATIONS_BACKUP_PASSPHRASE}" -ge 32
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile staged pre-cutover audit scripts without mutations
        run: python -m py_compile scripts/audit_preproduction_resources_and_dns.py scripts/sync_celebrations_latest_staging.py
      - name: Stage 7-9 daily account-wide quota check (no D1 SQL)
        run: node scripts/check-staging-d1-free-budget.mjs pre
      - name: Install pinned private audit dependencies
        run: python -m pip install 'requests==2.32.5' 'boto3==1.40.57' 'cryptography==46.0.4'
      - name: Step 7 and 8 - Inspect real production resources and preserve complete DNS config if accessible
        run: python scripts/audit_preproduction_resources_and_dns.py
      - name: Step 9 - PRE-CUTOVER source/editorial/media/analytics DRY RUN
        env:
          CELEBRATIONS_DELTA_APPLY: DRY_RUN
        run: python scripts/sync_celebrations_latest_staging.py
      - name: Step 9 - Catch up safe staging-only click changes, never call final production sync
        env:
          CELEBRATIONS_DELTA_APPLY: SAFE_STAGING_COPY
        run: python scripts/sync_celebrations_latest_staging.py
      - name: Verify free account-wide D1 budget remains healthy
        if: always()
        run: node scripts/check-staging-d1-free-budget.mjs post

  dns-authoritative-provider-discovery:
    # Query only PUBLIC authoritative DNS, no private zone/account credentials.
    if: ${{ github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && contains(github.event.head_commit.message, '[DNS_NS_ONLY_ONCE]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read public nameservers and WWW canonical record without mutations
        run: node scripts/discover_domain_dns_readonly.mjs

  provision-empty-production-free-resources:
    # Dedicated, empty resources ONLY. No DNS or D1 table/content imports.
    # Never run on main, PRs or without the explicit one-shot marker.
    if: ${{ github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && contains(github.event.head_commit.message, '[PROVISION_FREE_PROD_ONCE]') }}
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
    steps:
      - name: Check exact staging branch and existing Cloudflare account scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/celebrations-supabase-exit-001"
          test "$STAGING_R2_BUCKET" = "celebrations-exit-staging"
          for k in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN STAGING_D1_ID; do
            test -n "${!k:-}" || { echo "Missing permissioned Cloudflare staging secret"; exit 1; }
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require safe account-wide Free D1 usage before resource creation
        run: node scripts/check-staging-d1-free-budget.mjs pre
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned HTTPS client
        run: python -m pip install 'requests==2.32.5'
      - name: Create only empty, isolated EU D1 and private Standard R2 if permissions allow
        run: python scripts/provision_separate_production_free_resources.py

  production-empty-schema-once:
    # 19 EMPTY tables + indexes only. Never import source data, deploy Workers
    # or modify the public domain. Must be explicitly triggered once.
    if: ${{ github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && contains(github.event.head_commit.message, '[PROD_SCHEMA_EMPTY_ONCE]') }}
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
      CELEBRATIONS_PROD_R2_BUCKET: celebrations-exit-production
      CELEBRATIONS_STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      CELEBRATIONS_STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
    steps:
      - name: Restrict to approved migration branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/celebrations-supabase-exit-001"
          test "$STAGING_R2_BUCKET" = "celebrations-exit-staging"
          for k in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN STAGING_D1_ID; do
            test -n "${!k:-}" || exit 1
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard account-wide Cloudflare Free D1 quota
        run: node scripts/check-staging-d1-free-budget.mjs pre
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install private read-only identity validation dependency
        run: python -m pip install 'requests==2.32.5'
      - name: Prove production D1 EU identity, R2 Standard identity and zero existing tables
        run: python scripts/verify_production_database_schema.py pre
      - name: Install exact Wrangler v4
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Generate ephemeral production bindings, never check in IDs
        run: python scripts/prepare_production_wrangler.py
      - name: Create 17 empty CÉLÉBRATIONS tables and indexes only in new production D1
        working-directory: migration/cloudflare
        run: npx wrangler d1 execute celebrations-exit-production --remote --config wrangler.production.toml --file celebrations-schema.sql
      - name: Create 2 empty media ACL tables only in new production D1
        working-directory: migration/cloudflare
        run: npx wrangler d1 execute celebrations-exit-production --remote --config wrangler.production.toml --file media-acl.sql
      - name: Independently verify 19 production D1 tables and no participant/programme data
        run: python scripts/verify_production_database_schema.py post

  public-only-media-audit:
    # Choose protected public resources WITHOUT deleting/moving/copying any
    # source or R2 object. No Cloudflare credentials and ZERO D1 requests.
    if: ${{ github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && contains(github.event.head_commit.message, '[PUBLIC_ONLY_MEDIA_AUDIT_ONCE]') }}
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
