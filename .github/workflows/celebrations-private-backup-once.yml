          grep -Fx 'main = "editable-qa-worker.mjs"' migration/cloudflare/wrangler.editable-qa.toml
          grep -Fx 'run_worker_first = true' migration/cloudflare/wrangler.editable-qa.toml
          grep -Fx 'workers_dev = true' migration/cloudflare/wrangler.editable-qa.toml
          if grep -Eq '(^|[[:space:]])(route|routes|zone_id|custom_domain)[[:space:]]*=' migration/cloudflare/wrangler.editable-qa.toml; then exit 1; fi
      - name: Install pinned Wrangler and HTTPS client
        run: |
