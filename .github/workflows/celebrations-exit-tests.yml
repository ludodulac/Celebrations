name: Celebrations Supabase exit staging tests
on:
  push:
    branches: [feat/celebrations-supabase-exit-001]
    paths:
      - migration/**
      - tests/test-exit-media-gateway.mjs
      - tests/test-exit-preview-client.mjs
      - tests/test-exit-client-isolation.mjs
      - tests/test-exit-footer-admin.mjs
      - tests/test-exit-legal-drafts.mjs
      - tests/test-exit-participants-admin.mjs
      - public-click-tracking.js
      - public-footer-visibility.js
      - footer-page-public.js
      - admin-footer-pages.js
      - supabase-client.js
      - tests/test-exit-public-data.mjs
      - tests/test-exit-auth.mjs
      - tests/test-exit-staging-integration.mjs
      - tests/test-exit-safe-save-sqlite.mjs
      - tests/test-exit-stats.mjs
      - tests/test-exit-participant-full.mjs
      - tests/test-exit-d1-query-budget.mjs
      - tests/test-exit-admin-lifecycle.mjs
      - tests/test-exit-admin-ui-ids.mjs
      - admin-content-details.js
      - tests/test-exit-media-admin.mjs
      - admin-click-stats.js
      - public-click-tracking.js
      - tests/test_exit_export.py
      - .github/workflows/celebrations-exit-tests.yml
      - .github/workflows/celebrations-staging-deploy.yml
      - scripts/configure_staging_wrangler.py
      - scripts/verify-staging-media-http.mjs
      - scripts/verify-staging-public-http.mjs
      - scripts/verify-staging-browser.mjs
      - public-v3.js
      - admin-date-rules.js
      - public-date-rules.js
      - public-content-nav.js
      - public-library-simple.js
      - index.html
      - scripts/build_staging_assets.py
  pull_request:
    paths:
      - migration/**
      - tests/test-exit-media-gateway.mjs
      - tests/test-exit-footer-admin.mjs
      - tests/test-exit-preview-client.mjs
      - tests/test_exit_export.py
permissions:
  contents: read
jobs:
  staging-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check migration/cloudflare/preview-client.js
      - run: node --check public-v3.js && node --check public-date-rules.js && node --check public-content-nav.js && node --check public-library-simple.js && node --check admin-date-rules.js
      - run: node --test tests/test-exit-media-gateway.mjs tests/test-exit-public-data.mjs tests/test-exit-auth.mjs tests/test-exit-staging-integration.mjs tests/test-exit-preview-client.mjs tests/test-exit-client-isolation.mjs tests/test-exit-footer-admin.mjs tests/test-exit-legal-drafts.mjs tests/test-exit-participants-admin.mjs tests/test-exit-safe-save-sqlite.mjs tests/test-exit-stats.mjs tests/test-exit-participant-full.mjs tests/test-exit-media-admin.mjs tests/test-exit-d1-query-budget.mjs tests/test-exit-admin-lifecycle.mjs tests/test-exit-admin-ui-ids.mjs
      - run: python scripts/build_staging_assets.py
      - name: Verify isolated assets have no Supabase image or CDN SDK
        run: |
          python - <<'PY'
          from pathlib import Path
          home=Path("staging-public/index.html").read_text()
          admin=Path("staging-public/admin.html").read_text()
          assert 'src="/media/media/celebrations-staging-welcome-autumn-2026.jpg"' in home
          assert "cdn.jsdelivr.net/npm/@supabase/supabase-js" not in home+admin
          assert "storage/v1/object/public/celebrations-media/media/1791723108110" not in home
          assert "celebrationsStagingMedia" in Path("staging-public/migration/cloudflare/preview-client.js").read_text()
          PY
      - run: STAGING_D1_ID=00000000-0000-4000-8000-000000000000 STAGING_R2_BUCKET=celebrations-exit-staging python scripts/configure_staging_wrangler.py
      - name: Check Worker handles HTML staging redirects before assets
        run: grep -Fq 'run_worker_first = ["/", "/index.html", "/admin.html", "/admin"]' migration/cloudflare/wrangler.toml
      - run: python -m pip install 'requests>=2.32,<3' 'cryptography==46.0.4'
      - run: python -m unittest discover -s tests -p test_exit_export.py -v
      # Quota safety: no live D1 or HTTP staging tests on automatic commits.
      # Run full browser/D1 acceptance only by explicit, quota-aware approval.
      - name: Confirm automatic test job does not access Cloudflare D1
        run: echo "Local tests only; live D1 audit paused to protect 5M rows-read/day."
