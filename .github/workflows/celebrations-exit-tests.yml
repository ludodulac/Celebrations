name: Celebrations Supabase exit staging tests
on:
  push:
    branches: [feat/celebrations-supabase-exit-001]
    paths:
      - migration/**
      - tests/test-exit-media-gateway.mjs
      - scripts/test-public-library-programme.cjs
      - public-library-simple.js
      - tests/test-exit-public-data.mjs
      - tests/test-exit-auth.mjs
      - tests/test-exit-staging-integration.mjs
      - tests/test_exit_export.py
      - .github/workflows/celebrations-exit-tests.yml
      - .github/workflows/celebrations-staging-deploy.yml
      - scripts/configure_staging_wrangler.py
  pull_request:
    paths:
      - .github/workflows/celebrations-exit-tests.yml
      - migration/**
      - tests/test-exit-media-gateway.mjs
      - tests/test_exit_export.py
permissions:
  contents: read
jobs:
  staging-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/test-public-library-programme.cjs
      - run: node --test tests/test-exit-media-gateway.mjs tests/test-exit-public-data.mjs tests/test-exit-auth.mjs tests/test-exit-staging-integration.mjs
      - run: python scripts/build_staging_assets.py
      - run: STAGING_D1_ID=00000000-0000-4000-8000-000000000000 STAGING_R2_BUCKET=celebrations-exit-staging python scripts/configure_staging_wrangler.py
      - run: python -m pip install 'requests>=2.32,<3'
      - run: python -m unittest discover -s tests -p test_exit_export.py -v
