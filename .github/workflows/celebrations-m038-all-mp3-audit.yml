a/audio-1789475915608-2-lh190/file-1789475917548-63.-Guidance-audio-ceremonie-Ronde-des-Archanges.mp3","linked":true,"approved":true},{"name":"Invocation Temple matin — Psaume 154 de l’Archange Michaël — 19/09/2026","path":"media/1789828905376/file-1789828906802-2026-09-19_Temple-matin---Michael-Ps-154.mp3","linked":true,"approved":true},{"name":"Invocation Temple matin — Psaume 286 de l’Archange Michaël — 17/09/2026","path":"media/1789740282061/file-1789740283467-2026-09-17_Temple-matin---Michael-Ps-286.mp3","linked":true,"approved":true},{"name":"Invocation Temple matin — Psaume 62 de l’Archange Michaël — 18/09/2026","path":"media/1789759552378/file-1789759553733-2026-09-18_Temple-matin---Michael-Ps-62.mp3","linked":true,"approved":true},{"name":"Invocation Temple midi — Psaume 102 de l’Archange Michaël — 17/09/2026","path":"media/1789740506740/file-1789740509412-2026-09-17_Temple-midi---Michael-Ps-102.mp3","linked":true,"approved":true},{"name":"Invocation Temple midi — Psaume 106 de l’Archange Michaël — 20/09/2026","path":"media/1789932945033/file-1789932946161-2026-09-20_Temple-midi---Michael-Ps-106-1-.mp3","linked":true,"approved":true},{"name":"Invocation Temple midi — Psaume 125 de l’Archange Michaël — 19/09/2026","path":"media/1789847400932/file-1789847402049-2026-09-19_Temple-midi---Michael-Ps-125-1-.mp3","linked":true,"approved":true},{"name":"Invocation Temple midi — Psaume 28 de l’Archange Michaël — 18/09/2026","path":"media/1789759825105/file-1789759828522-2026-09-18_Temple-midi---Michael-Ps-28.mp3","linked":true,"approved":true},{"name":"Invocation Temple soir — Psaume 13 de l’Archange Michaël — 17/09/2026","path":"media/1789748941014/file-1789748942178-2026-09-17_Temple-soir---Michael-Ps-13.mp3","linked":true,"approved":true},{"name":"Invocation Temple soir — Psaume 39 de l’Archange Michaël — 18/09/2026","path":"media/1789770220036/file-1789770221539-2026-09-18_Temple-soir---Michael-Ps-39.mp3","linked":true,"approved":true},{"name":"Mélodie d'invocation de l'Archange Michael","path":"media/1789710019027/file-1789710020554-Melodie-dinvocation-de-lArchange-Michael-2.mp3","linked":true,"approved":true},{"name":"Méditation — Celui qui s’approche du Feu s’approche du Bonheur de la Vie","path":"media/audio-1789476017101-0-f6txg/file-1789476018843-67.-Meditation-Celui-qui-sapproche-du-Feu-Sapproche-du-Bonheur-de-la-Vie.mp3","linked":true,"approved":true},{"name":"Méditation — Comment acquérir le pardon des offenses — Olivier","path":"media/1789545298560/file-1789545301973-47.Comment-acquerir-le-pardon-des-offenses.Meditation.Olivier.mp3","linked":true,"approved":true},{"name":"Méditation — Cérémonie Le Soleil de l’âme","path":"media/1789545637540/file-1789545640591-Meditation-Ceremonie-le-Soleil-de-l-Ame.mp3","linked":false,"approved":false},{"name":"Méditation — Le soleil de la Paix","path":"media/1789545428732/file-1789545429921-53.Meditation-Le-soleil-de-la-Paix-.mp3.mp3","linked":true,"approved":true},{"name":"Méditation — L’Ange du Soleil","path":"media/audio-1789476040693-1-yslxe/file-1789476042770-68.-Meditation-L-Ange-du-Soleil.mp3","linked":true,"approved":true},{"name":"Niama Si Lakato — chant","path":"media/1790190586586/file-1790190587834-Niama-si-lakato---Quebec-2026.mp3","linked":true,"approved":true}];
          const failures=[],lines=[];
          const record=(kind,item,msg)=>{const str=kind+' | '+item.name+' | '+msg;console.log(str);lines.push(str);if(kind==='FAIL')failures.push(str);};
          let browser;
          async function fetchTimeout(url,init={},ms=20000){return fetch(url,{...init,signal:AbortSignal.timeout(ms)})}
          try {
          browser=await chromium.launch({headless:true,args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
          const mobile=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36'});
          const desktop=await browser.newContext({viewport:{width:1280,height:800},userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'});
          const mpage=await mobile.newPage(),dpage=await desktop.newPage();
          await mpage.goto(SITE,{waitUntil:'domcontentloaded',timeout:30000});
          await dpage.goto(SITE,{waitUntil:'domcontentloaded',timeout:30000});
          for(const item of inventory) {
          const url=SITE+'/media/'+item.path;
          try {
            if(!item.linked){const r=await fetchTimeout(url,{headers:{range:'bytes=0-1023'}});
              if(r.status!==404){record('FAIL',item,'Détaché mais accessible HTTP '+r.status)}else record('DETACHED',item,'Non rattaché à Michaël; 404 attendu');
              await r.arrayBuffer(); continue; }
            if(!item.approved){record('FAIL',item,'Rattaché mais non approuvé ACL');continue;}
            const h=await fetchTimeout(url,{method:'HEAD'});const size=Number(h.headers.get('content-length')||0);
            if(h.status!==200||!Number.isSafeInteger(size)||size<512){record('FAIL',item,'HEAD '+h.status+' / taille '+size);continue;}
            if(!/audio\/mpeg/i.test(h.headers.get('content-type')||'')){record('FAIL',item,'Type audio incorrect: '+h.headers.get('content-type'));continue;}
            if((h.headers.get('accept-ranges')||'').toLowerCase()!=='bytes'){record('FAIL',item,'Accept-Ranges absent');continue;}
            let bad='';
            for(const [label,start,end] of [['début',0,Math.min(size-1,65535)],['milieu',Math.max(0,Math.floor(size/2)),Math.min(size-1,Math.floor(size/2)+4095)],['fin',Math.max(0,size-4096),size-1]]) {
              const r=await fetchTimeout(url,{headers:{range:'bytes='+start+'-'+end}});
              const len=(await r.arrayBuffer()).byteLength;
              if(r.status!==206||len!==end-start+1||(r.headers.get('content-range')||'')!=='bytes '+start+'-'+end+'/'+size){bad=label+' HTTP '+r.status+' / '+len+' octets / '+r.headers.get('content-range');break;}
            }
            if(bad){record('FAIL',item,'Lecture réseau: '+bad);continue;}
            const playable=async (page)=>page.evaluate(async src=>{
              const audio=document.createElement('audio');audio.preload='auto';audio.muted=true;audio.src=src;audio.style.display='none';document.body.append(audio);
              let timer,interval;
              try {
                await Promise.race([audio.play(),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('play timeout')),12000)})]);
                await new Promise((resolve,reject)=>{
                  const started=Date.now();interval=setInterval(()=>{if(audio.currentTime>0.5)resolve();else if(audio.error)reject(new Error('MediaError '+audio.error.code));else if(Date.now()-started>15000)reject(new Error('timeupdate timeout; readyState='+audio.readyState+' networkState='+audio.networkState));},150);
                });
                return {ok:true,duration:audio.duration};
              } catch(e){return {ok:false,error:String(e)}}finally {clearTimeout(timer);clearInterval(interval);audio.pause();audio.remove();}
            },url);
            const m=await playable(mpage);const d=await playable(dpage);
            if(!m.ok||!d.ok) record('FAIL',item,'Mobile simule '+JSON.stringify(m)+' / ordinateur '+JSON.stringify(d));
            else record('PASS',item,'HEAD 200, 3 plages 206, lecture Chromium mobile + ordinateur, '+(size/1048576).toFixed(1)+' Mio');
          } catch(e){record('FAIL',item,String(e).slice(0,300));}
          }
          await browser.close();browser=null;
          } catch(e){console.error('CRITICAL',e);failures.push('CRITICAL '+String(e))}
          finally{if(browser)await browser.close().catch(()=>{});}
          const pass=lines.filter(x=>x.startsWith('PASS')).length,detached=lines.filter(x=>x.startsWith('DETACHED')).length,fail=failures.length;
          console.log('M038_ALL_40_AUDIOS_AUDIT pass='+pass+' detached='+detached+' failed='+fail+' total='+inventory.length);
          const summary=['## Audit intégral MP3 Michaël 2026','',pass+' lecture(s) validée(s) sur '+inventory.length+' MP3 en base. '+detached+' MP3 non rattachés (404 attendu), '+fail+' échec(s).','',...lines.map(x=>'- '+x),''].join('\n');
          if(process.env.GITHUB_STEP_SUMMARY)appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          if(fail)process.exitCode=1;
          AUDIT
          node audit.mjs
