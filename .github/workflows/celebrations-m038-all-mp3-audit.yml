name: "M038 — audit complet des 40 MP3 de Michaël 2026"
on:
  push:
    branches: [fix/m038-audio-android-library-20261114]
permissions: {contents: read}
jobs:
  all-mp3:
    if: ${{ contains(github.event.head_commit.message, '[M038_ALL_MP3]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Préparer navigateur Chromium
        run: |
          mkdir -p /tmp/celebrations-mp3
          cd /tmp/celebrations-mp3
          npm init -y
          npm install --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
      - name: Tester 40 MP3, lecture mobile simulée, ordinateur et HTTP Range
        working-directory: /tmp/celebrations-mp3
        run: |
          cat > audit.mjs <<'AUDIT'
          import { chromium } from 'playwright';
          import { appendFileSync } from 'node:fs';
          const SITE='https://ronde-des-archanges-universelle.eu';
