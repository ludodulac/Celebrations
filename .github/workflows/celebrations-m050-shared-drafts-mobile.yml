name: M050 — brouillons partagés sur mobile
on:
  push:
    branches: [fix/m050-online-shared-drafts-mobile-current-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify generated editor and collaboration
        run: |
          node scripts/build-m019-editor-client.mjs --check
          node --check migration/cloudflare/editor-demo-client.mjs
          node --test tests/test_m045_admin_collaboration.mjs
      - name: Build official assets without deploying
        run: |
          python3 scripts/build_production_assets.py
          test -s production-public/admin.html
