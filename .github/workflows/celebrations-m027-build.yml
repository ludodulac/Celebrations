name: Célébrations M027 — gros MP3 R2, compilation et tests
on:
  push:
    branches: [feat/m027-pdf-privacy-navigation-title-20261112]
permissions:
  contents: write
concurrency:
  group: celebrations-m027-bundles
  cancel-in-progress: false
jobs:
  compile-and-verify:
    if: ${{ contains(github.event.head_commit.message, '[M027_BUILD_AND_TEST]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild canonical bundled source, NEVER edit generated code by hand
        run: |
          set -euo pipefail
          node scripts/build-m012b-member-spaces-inline.mjs
          node scripts/build-m019-editor-client.mjs
          node scripts/build-m012b-member-spaces-inline.mjs --check
          node scripts/build-m019-editor-client.mjs --check
          node --check migration/cloudflare/editor-demo-client.mjs
          node --check migration/cloudflare/app/admin/editor-member-spaces-integration.mjs
          node --check migration/cloudflare/app/domain/editor-media-usage-safety.mjs
          node --check migration/cloudflare/app/application/editor-multipart-upload.mjs
          node --check migration/cloudflare/app/domain/editor-site-preferences.mjs
          node --check migration/cloudflare/editor-trial-site-page.mjs
          node --check migration/cloudflare/media-gateway.mjs
          node --check migration/cloudflare/app/admin/real-editor-member-spaces.mjs
          node --check migration/cloudflare/app/styles/admin/stage-layout.mjs
      - name: Editor command regression tests without production writes
        run: |
          node --test tests/test_m027_pdf_privacy_navigation.mjs tests/test-exit-media-gateway.mjs tests/test_m009c_public_media_api_security.mjs tests/test-editor-publication-media.mjs tests/test_m026_real_mp3_detection.mjs tests/test_m025_mp3_multipart.mjs tests/test_m024_cleanup_and_media_safety.mjs tests/test_m022_editor_commands.mjs tests/test_m021b_admin_mode.mjs \
           tests/test_m020e_integrated_migrations.mjs tests/test-editor-publication-media.mjs \
           tests/test-editor-server-drafts.mjs tests/test_m012c_private_editor_publication.mjs \
           tests/test_m018_final_functional_rules.mjs
      - name: Commit ONLY rebuilt generated modules, no other files or deployed data
        run: |
          set -euo pipefail
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -- migration/cloudflare/app/admin/real-editor-member-spaces-inline.mjs \
                     migration/cloudflare/editor-demo-client.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'M027 — rebuild generated editor module [skip ci]'
            git push origin HEAD:feat/m027-pdf-privacy-navigation-title-20261112
          fi
          echo M027_CANONICAL_BUILD_AND_TEST_PASS
