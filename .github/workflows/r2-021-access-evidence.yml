name: R2 media access evidence (read-only)
on:
  push:
    branches: [feat/r2-019-safe-preparation]
    paths:
      - scripts/audit_r2_media_access_evidence.py
      - .github/workflows/r2-021-access-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'requests>=2.32,<3'
      - name: Collect read-only access evidence
        run: python scripts/audit_r2_media_access_evidence.py
      - name: Store private evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-021-access-evidence
          path: r2-021-access-evidence.json
          if-no-files-found: warn
          retention-days: 7
