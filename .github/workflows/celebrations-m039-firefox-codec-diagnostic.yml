name: "M039 — diagnostic Firefox MP3 / codec"
on:
  push:
    branches: [fix/m038-audio-android-library-20261114]
permissions: {contents: read}
jobs:
  firefox-diagnostic:
    if: ${{ contains(github.event.head_commit.message, '[M039_FIREFOX_DIAG]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install Playwright Chromium and Firefox
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium firefox
      - name: Compare known good synthetic MP3 versus official MP3 across engines
        run: node scripts/test-m039-firefox-audio-codec-diagnostic.mjs
