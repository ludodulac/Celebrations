name: Real staging R2 file upload edit and delete acceptance
on:
  push:
    branches: [feat/celebrations-supabase-exit-001]
    paths:
      - .github/workflows/celebrations-staging-media-roundtrip-once.yml
permissions:
  contents: read
concurrency:
  group: celebrations-staging-real-media-acceptance
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/feat/celebrations-supabase-exit-001'
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 14
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
      STAGING_SYNTHETIC_MEDIA_WRITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated media fixtures are safe
        run: |
          test "$STAGING_R2_BUCKET" = celebrations-exit-staging
          node --check scripts/verify-staging-media-roundtrip.mjs
          python -m py_compile scripts/verify-staging-authenticated-admin.py
      - name: Install read-only browser and Cloudflare API dependency
        run: |
          python -m pip install 'requests>=2.32,<3'
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run authenticated synthetic R2 media lifecycle and ensure cleanup
        run: python scripts/verify-staging-authenticated-admin.py
