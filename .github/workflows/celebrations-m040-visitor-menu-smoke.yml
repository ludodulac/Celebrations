name: "M040 — vérification des menus visiteurs sur le site officiel"
on:
  push:
    branches: [fix/m038-audio-android-library-20261114]
permissions: {contents: read}
jobs:
  visitor-gallery:
    if: ${{ contains(github.event.head_commit.message, '[M040_VERIFY]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install Chromium for read-only production smoke
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium
      - name: Check official menus, legacy gallery and per-celebration 38 MP3
        run: node scripts/test-m040-global-gallery-retired-browser.mjs
