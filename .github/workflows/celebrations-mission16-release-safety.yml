name: CÉLÉBRATIONS M16 — contrôle de release et rollback SANS déploiement
on:
  push:
    branches: [refactor/celebrations-mission-16-release-rollback-20261108]
permissions:
  contents: read
jobs:
  release-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntaxe, refus systématique de release et matrice de non-régression
        run: |
          node --check migration/cloudflare/app/release/editor-release-policy.mjs
          node --check scripts/mission16_capture_worker_readonly.mjs
          node --check scripts/mission16_release_preflight_readonly.mjs
          node --check scripts/mission16_editor_regressions.mjs
          node --test tests/test_mission16_release_rollback.mjs
          node scripts/mission16_editor_regressions.mjs
      - name: Restauration locale synthétique D1/media uniquement (aucun Cloudflare)
        run: python -m unittest discover -s tests -p 'test_mission16_recovery.py' -v
      - name: Contrôle M02 ordinateur/téléphone, fichiers, glisser-déposer et visiteurs
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
          node scripts/mission02-editor-reference-browser.mjs
          node scripts/test-editor-media-picker-browser.mjs
          node scripts/mission11-drag-undo-browser.mjs
          node scripts/mission12-public-visitor-browser.mjs
          node scripts/mission13-style-browser.mjs
      - name: Captures synthétiques pour comparaison M02
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celebrations-m16-release-proof-${{ github.run_number }}
          path: |
            artifacts/mission02/editor-fixture/
            artifacts/mission13/style-fixture/
          retention-days: 14
          if-no-files-found: warn

  worker-metadata-readonly:
    # Separate explicit one-shot, not a deployment nor an automatic secret-bearing
    # step on every source commit. Uses only GET /deployments on the official
    # Worker to identify the actual active deployment/version, never PUT/POST.
    if: ${{ contains(github.event.head_commit.message, '[M16_WORKER_READONLY_ONCE]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: celebrations-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read exact active Worker metadata via Cloudflare GET; no write
        run: |
          node scripts/mission16_capture_worker_readonly.mjs
          echo "M16_WORKER_METADATA_ONLY no_deployment=true no_d1_writes=true no_r2_writes=true"
