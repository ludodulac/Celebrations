name: CÉLÉBRATIONS M05 — LIVRAISON OFFICIELLE avec rollback exact automatique
on:
  push:
    branches: [release/celebrations-finalisation-05-livraison-20261109]
permissions:
  contents: read
concurrency:
  group: celebrations-finalisation-m05-release
  cancel-in-progress: false
jobs:
  publier-exacte-version-validee:
    if: ${{ github.run_attempt == 1 && contains(github.event.head_commit.message, '[M05_PUBLISH_OFFICIAL_ONCE]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: celebrations-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      PROD_D1_ID: 28736d2a-479b-472b-bf82-703ad0affe10
      CELEBRATIONS_PROD_D1_ID: 28736d2a-479b-472b-bf82-703ad0affe10
      CELEBRATIONS_PROD_R2_BUCKET: celebrations-exit-production
      CELEBRATIONS_STAGING_R2_BUCKET: celebrations-exit-staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Strict release scope and immutable application baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/celebrations-finalisation-05-livraison-20261109
          git merge-base --is-ancestor ac57825edae91e595f96f9dcf1ed0045a1ba6ed8 HEAD
          BAD="$(git diff --name-only ac57825edae91e595f96f9dcf1ed0045a1ba6ed8 HEAD | grep -Ev '^((scripts/finalisation05_[^/]+\.(mjs|py))|(tests/test_finalisation05_[^/]+\.(mjs|py))|(\.github/workflows/celebrations-finalisation-mission-05[^/]*\.yml)|(docs/finalisation/CELEBRATIONS-FINALISATION-MISSION-05-2026-11-09\.md))$' || true)"
          if [ -n "$BAD" ]; then echo M05_UNEXPECTED_CHANGE_BLOCKED; exit 1; fi
          test "$PROD_D1_ID" = 28736d2a-479b-472b-bf82-703ad0affe10
          test "$CELEBRATIONS_PROD_R2_BUCKET" = celebrations-exit-production
          echo M05_APP_IDENTICAL_TO_BROWSER_VERIFIED_CANDIDATE_PASS
      - name: Native rollback rehearsal already verified on separate candidate
        shell: bash
        run: |
          # Evidence: immutable version swap and rollback, confirmed M05 isolated CI
          # run 42670904017 with official Worker deployment unchanged.
          node --check scripts/finalisation05_production_promotion.mjs
          node --check scripts/finalisation05_failsafe_rollback.mjs
          node --check scripts/finalisation05_uploaded_version_validation.mjs
          node --test tests/test_mission16_release_rollback.mjs tests/test_finalisation02_preview_security.mjs
          echo M05_ROLLBACK_REHEARSAL_EVIDENCE_CHECKED_RUN_42670904017
      - name: Final current official binding/revision/DB/public route guard
        run: |
          node scripts/finalisation05_release_preflight.mjs
          node scripts/finalisation05_uploaded_version_validation.mjs
      - name: Prepare Chromium for real official post-publish visitor acceptance
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Activate ONLY the previously uploaded, vetted immutable Worker version
        id: promote
        env:
          M05_ALLOW_LIVE_DEPLOY: 'yes'
        run: node scripts/finalisation05_production_promotion.mjs
      - name: Verify official website, mobile + desktop and protected drafts in real Chromium
        run: node scripts/finalisation04_live_readonly_browser.mjs
      - name: Verify 113/113 public media and PDF 9/9 on BOTH official domains only
        run: node scripts/finalisation04_media_pdf_host_audit.mjs
      - name: 'Final official admin form — signed CSRF and invalid code rejection without login'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          for(const origin of ['https://ronde-des-archanges-universelle.eu',
                              'https://www.ronde-des-archanges-universelle.eu']){
            const login=await fetch(origin+'/admin.html',{cache:'no-store',
              signal:AbortSignal.timeout(25000)});
            assert.equal(login.status,200);
            const html=await login.text();
            assert.ok(html.includes('Code d’accès'));
            const token=html.match(/name="_csrf" value="([0-9]{13}\.[a-f0-9]{32}\.[a-f0-9]{64})"/)?.[1];
            assert.ok(token,'CSRF login token is missing');
            const wrong=await fetch(origin+'/api/editor-access',{method:'POST',
              redirect:'manual',headers:{'content-type':'application/x-www-form-urlencoded'},
              body:new URLSearchParams({_csrf:token,code:'fictional-invalid-verify'}),
              signal:AbortSignal.timeout(25000)});
            assert.equal(wrong.status,303,'Invalid code should be rejected normally');
            assert.match(wrong.headers.get('location')||'',/erreur=1/);
            assert.equal(wrong.headers.get('set-cookie'),null,'Bad code must not issue login cookie');
            await wrong.body?.cancel().catch(()=>{});
          }
          console.log('M05_OFFICIAL_ADMIN_LOGIN_FORM_BAD_CODE_REJECTED_PASS hosts=2 no_valid_credentials_tested=true');
          NODE
      - name: Confirm exact published version and technical hostname still disabled
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/celebrations-exit-production';
          for(const [path,verify] of [
           ['/deployments',result=>{
             assert.equal(result.deployments?.[0]?.versions?.length,1);
             assert.equal(result.deployments[0].versions[0].version_id,
               'eccb1274-2ed8-491f-8557-c4330342e4bf');
             assert.equal(result.deployments[0].versions[0].percentage,100);
             console.log('M05_FINAL_OFFICIAL_WORKER_RELEASE_PASS '+JSON.stringify({
              newDeploymentId:result.deployments[0].id,
              versionId:result.deployments[0].versions[0].version_id,
              oldRollbackVersionId:'dcda4193-1d82-4283-9f0e-ae8a09e6a444',
              trafficPercent:100
             }));
           }],
           ['/subdomain',result=>{
             assert.equal(result.enabled,false);
             assert.equal(result.previews_enabled,false);
           }]
          ]){
            const r=await fetch(base+path,{headers:{authorization:'Bearer '+token},
              signal:AbortSignal.timeout(25000)});
            assert.equal(r.status,200);
            const obj=await r.json();
            assert.equal(obj.success,true);
            verify(obj.result);
          }
          console.log('M05_FINAL_TECHNICAL_HOSTS_DISABLED_PASS noDnsWrites=true noD1Writes=true noR2Writes=true');
          NODE
      - name: IF ANY post-deploy test failed, restore exact ORIGINAL immutable Worker version and assets
        if: ${{ always() && steps.promote.outputs.attempted == 'yes' && failure() }}
        run: node scripts/finalisation05_failsafe_rollback.mjs
      - name: End summary (only succeeds if all post-release checks succeeded)
        run: echo M05_DELIVERY_PUBLISHED_VERIFIED_KEEP_OLD_VERSION_FOR_RECOVERY
