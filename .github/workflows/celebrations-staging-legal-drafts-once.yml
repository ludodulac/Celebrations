name: Prepare existing legal templates as private Cloudflare staging drafts
# DAILY D1 FREE QUOTA GUARD: do not automatically run expensive staging HTTP
# audits or data writes on every code commit. Manual confirmation only.
on:
  workflow_dispatch:
    inputs:
      confirm_quota:
        description: Type RUN_STAGING after verifying daily D1 rows-read headroom
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: celebrations-staging-legal-private-drafts
  cancel-in-progress: false
jobs:
  staging-legal:
    if: github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && inputs.confirm_quota == 'RUN_STAGING'
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3'
      - name: Initialize private editable legal drafts without publishing placeholders
        run: python scripts/seed-staging-footer-drafts.py
