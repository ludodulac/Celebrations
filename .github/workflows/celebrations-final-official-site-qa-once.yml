name: CÉLÉBRATIONS — final official website mobile/media/PDF read-only check
on:
  push:
    branches: [feat/celebrations-supabase-exit-001]
permissions:
  contents: read
jobs:
  final-site-audit:
    if: ${{ github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && contains(github.event.head_commit.message, '[FINAL_OFFICIAL_SITE_QA_ONCE]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    environment: celebrations-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      PROD_D1_ID: 28736d2a-479b-472b-bf82-703ad0affe10
      STAGING_D1_ID: 0f761662-241f-42cc-ac94-5c68b4aa7797
      STAGING_R2_BUCKET: celebrations-exit-staging
    steps:
      - name: Restrict this job to no writes on official domain
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/celebrations-supabase-exit-001"
          test "$PROD_D1_ID" = "28736d2a-479b-472b-bf82-703ad0affe10"
          echo "FINAL_OFFICIAL_QA_WILL_NOT_CHANGE_DNS_WORKERS_SUPABASE_D1_R2"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax guard and daily D1 shared free reserve
        run: |
          node --check scripts/mission14_official_site_browser.mjs
          node --check scripts/mission14_official_public_media_pdfs.mjs
          node scripts/check-staging-d1-free-budget.mjs pre
      - name: Confirm all publicly approved media and nine mailed letters on official/old host
        run: node scripts/mission14_official_public_media_pdfs.mjs
      - name: Install Chromium once for read-only desktop and mobile site UX
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test homepage/day/programme/mediatheque/image/audio-video tabs on real domain with all browser POST blocked
        run: node scripts/mission14_official_site_browser.mjs
      - name: Audit complete and Cloudflare D1 quota reserve
        if: always()
        run: |
          node scripts/check-staging-d1-free-budget.mjs post
          echo "FINAL_OFFICIAL_QA_READONLY; no real browser submissions, no emails, no DNS change or Worker deployment"
