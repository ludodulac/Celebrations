name: CÉLÉBRATIONS — suppression ciblée de l'ancien Storage Supabase (autorisation propriétaire)
on:
  push:
    branches: [feat/celebrations-supabase-exit-001]
permissions:
  contents: read
jobs:
  delete-only-old-celebrations-media:
    if: ${{ github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && contains(github.event.head_commit.message, '[DELETE_OLD_CELEBRATIONS_STORAGE_ONCE]') }}
    runs-on: ubuntu-latest
    environment: celebrations-staging
    concurrency:
      group: celebrations-source-cleanup-single-owner-approved-operation
      cancel-in-progress: false
    timeout-minutes: 32
    env:
      CELEBRATIONS_DELETE_SOURCE_APPROVAL: OWNER_APPROVED_2026_10_28
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CELEBRATIONS_BACKUP_PASSPHRASE: ${{ secrets.CELEBRATIONS_BACKUP_PASSPHRASE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
      STAGING_R2_ACCESS_KEY_ID: ${{ secrets.CELEBRATIONS_STAGING_R2_ACCESS_KEY_ID }}
      STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.CELEBRATIONS_STAGING_R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      PROD_D1_ID: 28736d2a-479b-472b-bf82-703ad0affe10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm owner scope and exact shared Supabase/R2 identities
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/celebrations-supabase-exit-001"
          test "$CELEBRATIONS_DELETE_SOURCE_APPROVAL" = "OWNER_APPROVED_2026_10_28"
          test "${SUPABASE_URL%/}" = "https://jwyayfkssyagvnablttg.supabase.co"
          test "$STAGING_R2_BUCKET" = "celebrations-exit-staging"
          test "$STAGING_D1_ID" = "0f761662-241f-42cc-ac94-5c68b4aa7797"
          test "$PROD_D1_ID" = "28736d2a-479b-472b-bf82-703ad0affe10"
          test "${#CELEBRATIONS_BACKUP_PASSPHRASE}" -ge 32
          for v in SUPABASE_SERVICE_ROLE_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN STAGING_R2_ACCESS_KEY_ID STAGING_R2_SECRET_ACCESS_KEY R2_ENDPOINT; do test -n "${!v:-}" || exit 1; done
      - name: Check daily shared D1 Free quota first
        run: node scripts/check-staging-d1-free-budget.mjs pre
      - name: Install pinned offline backup and Storage API requirements
        run: python -m pip install 'requests==2.32.5' 'cryptography==46.0.4' 'boto3==1.40.57'
      - name: Mandatory fresh private encrypted backup and RAM restore BEFORE any deletion
        shell: bash
        env:
          TMPDIR: /dev/shm
        run: |
          set -euo pipefail
          python -m scripts.mission11_refresh_private_backup
          echo 'CELEBRATIONS_ENCRYPTED_BACKUP_JUST_VERIFIED=yes' >> "$GITHUB_ENV"
      - name: Verify source participant/editorial parity & full 158 original R2 keys before deletion
        run: |
          python -m scripts.mission11_preflight_source_vs_cloudflare
          python -m scripts.audit_celebrations_media_dual_copy_readonly
      - name: Catch up all historical source click rows without touching new Cloudflare visits
        run: python -m scripts.import_historic_stats_production_d1
      - name: Delete ONLY the 158 old celebrations-media Supabase Storage objects via Storage API and then empty bucket
        run: python -m scripts.delete_supabase_celebrations_media_once
      - name: Recheck daily D1 quotas without touching any other project
        if: always()
        run: node scripts/check-staging-d1-free-budget.mjs post
