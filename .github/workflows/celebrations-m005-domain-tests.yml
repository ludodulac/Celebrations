name: CELEBRATIONS M002 M003 M005 pure domain tests
on:
  push:
    branches:
      - feat/celebrations-m005-spaces-duplication-20261110
    paths:
      - 'migration/cloudflare/app/domain/member-access.mjs'
      - 'migration/cloudflare/app/domain/editor-localization.mjs'
      - 'migration/cloudflare/app/domain/celebration-spaces.mjs'
      - 'tests/test_mission002_member_access.mjs'
      - 'tests/test_m003_localization.mjs'
      - 'tests/test_m005_celebration_spaces.mjs'
      - '.github/workflows/celebrations-m005-domain-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check migration/cloudflare/app/domain/member-access.mjs
          node --check migration/cloudflare/app/domain/editor-localization.mjs
          node --check migration/cloudflare/app/domain/celebration-spaces.mjs
      - name: Run M002 M003 M005 native regression tests (no deployments)
        run: |
          node --test tests/test_mission002_member_access.mjs tests/test_m003_localization.mjs tests/test_m005_celebration_spaces.mjs
