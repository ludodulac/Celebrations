name: Upgrade one existing participant verifier in isolated Cloudflare staging
# Pause repeated staging D1 account migration checks to protect free quota.
on:
  workflow_dispatch:
    inputs:
      confirm_quota:
        description: Type RUN_STAGING only after reviewing daily D1 quota
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: celebrations-staging-participant-verifier-upgrade
  cancel-in-progress: false
jobs:
  verify-and-upgrade:
    if: github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && inputs.confirm_quota == 'RUN_STAGING'
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install private staging-only dependency
        run: python -m pip install 'requests>=2.32,<3'
      - name: Safely wrap existing 180k password/recovery verifiers and check preservation
        run: python scripts/migrate_participant_staging.py
