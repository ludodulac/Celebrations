name: Staging real authenticated admin browser audit (one-time)
# D1 free quota protection: automatic authenticated browser scans stay PAUSED.
on:
  workflow_dispatch:
    inputs:
      confirm_quota:
        description: Type RUN_STAGING after verifying D1 free headroom
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: celebrations-staging-auth-readonly-audit
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && inputs.confirm_quota == 'RUN_STAGING'
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 2.5M D1 rows-read free headroom using analytics only
        run: node scripts/check-staging-d1-free-budget.mjs pre
      - name: Install read-only browser and Cloudflare API client
        run: |
          python -m pip install 'requests>=2.32,<3'
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify real authenticated mobile administration READ ONLY
        run: python scripts/verify-staging-authenticated-admin.py
      - name: Check account-wide D1 free quota after test without SQL
        if: always()
        run: node scripts/check-staging-d1-free-budget.mjs post
