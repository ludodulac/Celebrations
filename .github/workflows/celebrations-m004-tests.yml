name: "Célébrations M004 — tests sans déploiement"
on:
  push:
    branches:
      - feat/celebrations-m004-page-footer-localization-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multilingual-private-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fondations M002 et M003 puis raccordement M004 et régressions
        run: |
          node --test \
            tests/test_mission002_member_access.mjs \
            tests/test_m003_localization.mjs \
            tests/test_m004_page_localization.mjs \
            tests/test-editor-server-drafts.mjs \
            tests/test_mission09_page_lifecycle.mjs \
            tests/test_editor_m11_mobile_insert_footer_delete.mjs
