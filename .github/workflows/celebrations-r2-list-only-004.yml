# Mission CELEBRATIONS-R2-LIST-ONLY-004A. Read-only R2 inventory.
# Account and bucket verified independently via Cloudflare API before any R2 listing.
name: Celebrations R2 inventory — LIST ONLY

on:
  workflow_dispatch:
  push:
    branches:
      - audit/celebrations-r2-list-only-004
    paths:
      - .github/workflows/celebrations-r2-list-only-004.yml

permissions:
  contents: read

jobs:
  inventory:
    name: Inspect only celebrations-media in R2
    if: github.ref == 'refs/heads/audit/celebrations-r2-list-only-004'
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 12
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      EXPECTED_R2_ACCOUNT_ID: ${{ vars.CELEBRATIONS_R2_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      CF_STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
    steps:
      - name: Install client
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Fail-closed account verification and read-only listing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from datetime import datetime, timezone
          import boto3
          from botocore.config import Config

          # Fail-closed preflight. Only HTTPS GET to Cloudflare and S3 ListObjectsV2.
          bucket = 'celebrations-media'
          staging_bucket = 'celebrations-exit-staging'
          endpoint = os.environ.get('R2_ENDPOINT', '')
          expected = os.environ.get('EXPECTED_R2_ACCOUNT_ID', '').lower().strip()
          cf_account = os.environ.get('CF_ACCOUNT_ID', '').lower().strip()
          cf_token = os.environ.get('CF_API_TOKEN', '')
          d1_id = os.environ.get('CF_STAGING_D1_ID', '').strip()
          access = os.environ.get('R2_ACCESS_KEY_ID', '')
          secret = os.environ.get('R2_SECRET_ACCESS_KEY', '')
          parsed = urlparse(endpoint)
          match = re.fullmatch(r'([0-9a-f]{32})\.r2\.cloudflarestorage\.com', parsed.hostname or '')
          if (parsed.scheme != 'https' or parsed.path not in ('', '/') or parsed.query
                  or parsed.fragment or not match or parsed.netloc != parsed.hostname):
              raise SystemExit('STOP: R2 endpoint not a canonical Cloudflare account endpoint')
          account = match.group(1)
          if not re.fullmatch(r'[0-9a-f]{32}', cf_account) or account != cf_account:
              raise SystemExit('STOP: R2 endpoint account differs from independently configured staging account')
          if expected and (not re.fullmatch(r'[0-9a-f]{32}', expected) or account != expected):
              raise SystemExit('STOP: R2 account ID does not match declared expected ID')
          if not re.fullmatch(r'[0-9a-fA-F-]{36}', d1_id) or not cf_token:
              raise SystemExit('STOP: independent Cloudflare account verification is unavailable')
          if not access or not secret:
              raise SystemExit('STOP: R2 read credentials are unavailable')
          if bucket == staging_bucket:
              raise SystemExit('STOP: production bucket confused with staging')

          def cloudflare_get(path):
              req = Request('https://api.cloudflare.com/client/v4' + path,
                            headers={'Authorization': 'Bearer ' + cf_token,
                                     'Accept': 'application/json'}, method='GET')
              try:
                  with urlopen(req, timeout=30) as response:
                      data = json.load(response)
              except (HTTPError, URLError, ValueError) as err:
                  raise SystemExit('STOP: Cloudflare independent GET failed (' + type(err).__name__ + ')')
              if data.get('success') is not True:
                  raise SystemExit('STOP: Cloudflare independent GET returned non-success')
              return data.get('result')

          token = cloudflare_get('/user/tokens/verify')
          if not isinstance(token, dict) or token.get('status') != 'active':
              raise SystemExit('STOP: Cloudflare verification token is not active')
          database = cloudflare_get('/accounts/' + cf_account + '/d1/database/' + d1_id)
          if not isinstance(database, dict) or database.get('uuid') != d1_id or database.get('name') != staging_bucket:
              raise SystemExit('STOP: independent Cloudflare staging account/D1 identity mismatch')
          storage = cloudflare_get('/accounts/' + cf_account + '/r2/buckets/' + bucket)
          if not isinstance(storage, dict) or storage.get('name') != bucket:
              raise SystemExit('STOP: target R2 bucket identity not confirmed by independent Cloudflare API')

          print('R2_PREFLIGHT_PASS: Cloudflare token active; D1 account verified; target R2 bucket confirmed; correct R2 account endpoint')
          s3 = boto3.client('s3',
              endpoint_url=endpoint,
              aws_access_key_id=access,
              aws_secret_access_key=secret,
              region_name='auto',
              config=Config(retries={'max_attempts': 3, 'mode': 'standard'}))
          objects = []
          seen = set()
          page_count = 0
          last_truncated = None
          for page in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket):
              page_count += 1
              if page.get('Name') not in (None, bucket):
                  raise SystemExit('STOP: R2 listing reported a different bucket')
              last_truncated = page.get('IsTruncated', False)
              if last_truncated and not page.get('NextContinuationToken'):
                  raise SystemExit('STOP: truncated R2 page without continuation token')
              for obj in page.get('Contents', []):
                  key = obj['Key']
                  if key in seen:
                      raise SystemExit('STOP: repeated R2 key')
                  seen.add(key)
                  lm = obj.get('LastModified')
                  objects.append({'key': key, 'bytes': int(obj['Size']),
                                  'etag': obj.get('ETag', ''),
                                  'last_modified': lm.isoformat() if lm else None})
          if page_count == 0 or last_truncated:
              raise SystemExit('STOP: R2 listing did not reach a complete final page')
          objects.sort(key=lambda x: x['key'])
          report = {
              'scope': 'R2 LIST ONLY',
              'bucket': bucket,
              'independent_cloudflare_api_bucket_verified': True,
              'independent_staging_d1_account_verified': True,
              'timestamp_utc': datetime.now(timezone.utc).isoformat(),
              'page_count': page_count,
              'pagination_complete': True,
              'object_count_live': len(objects),
              'bytes_total_live': sum(x['bytes'] for x in objects),
              'historical_count_expected': 158,
              'historical_bytes_expected': 830312417,
              'objects': objects,
              'binary_sha256_recomputed': False,
              'mutations_performed': 0,
          }
          with open('celebrations-r2-list-only-manifest.json', 'w', encoding='utf8') as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          print('R2_LIST_ONLY_SUMMARY', json.dumps({
              k:v for k,v in report.items() if k != 'objects'}, ensure_ascii=False))
          PY
      - name: Preserve the result as a GitHub Actions report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: celebrations-r2-list-only-manifest
          path: celebrations-r2-list-only-manifest.json
          if-no-files-found: error
          retention-days: 7