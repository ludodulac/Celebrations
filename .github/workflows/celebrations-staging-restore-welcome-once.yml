name: Restore one staging homepage JPG (isolated)
on:
  push:
    branches: [feat/celebrations-supabase-exit-001]
    paths:
      - .github/workflows/celebrations-staging-restore-welcome-once.yml
permissions:
  contents: read
concurrency:
  group: celebrations-staging-restore-welcome-once
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref == 'refs/heads/feat/celebrations-supabase-exit-001'
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      STAGING_R2_ACCESS_KEY_ID: ${{ secrets.CELEBRATIONS_STAGING_R2_ACCESS_KEY_ID }}
      STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.CELEBRATIONS_STAGING_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install narrowly scoped staging transfer dependencies
        run: python -m pip install 'boto3>=1.35,<2' 'requests>=2.32,<3'
      - name: Restore and verify exactly one public homepage JPG to staging R2
        run: python scripts/restore-staging-welcome-image.py
      - name: Confirm isolated staging gateway serves the JPG
        run: |
          python - <<'PY'
          import requests
          url="https://celebrations-exit-staging.rondes.workers.dev/media/media/celebrations-staging-welcome-autumn-2026.jpg"
          r=requests.head(url,timeout=25)
          print("STAGING_WELCOME_JPG_HTTP",r.status_code,r.headers.get("content-type"))
          assert r.status_code==200 and r.headers.get("content-type","").startswith("image/jpeg")
          PY
