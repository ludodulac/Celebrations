name: "M032 — liens indépendants R2 et images visibles en ligne (officiel)"
on:
  push:
    branches: [feat/m032-media-links-independent-20261113]
permissions: {contents: read}
concurrency:
  group: celebrations-existing-official-production-release
  cancel-in-progress: false
jobs:
  visibility-official:
    if: ${{ github.run_attempt == 1 && contains(github.event.head_commit.message, '[M032_OFFICIAL]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: celebrations-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      ORIGINAL_VERSION: '62c75430-fcc4-4c88-8bbf-65f056dacb5a'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Exact official read-only gate — no data edits
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/m032-media-links-independent-20261113'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const acct=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          assert.equal(acct,'60a7b17758a93fe6681ce998e72ddff0');
          assert.ok(token?.length>20);
          const base='https://api.cloudflare.com/client/v4/accounts/'+acct;
          const headers={authorization:'Bearer '+token};
          const r=await fetch(base+'/workers/scripts/celebrations-exit-production/deployments',{headers});
          assert.equal(r.status,200);const j=await r.json();assert.equal(j.success,true);
          const v=j.result?.deployments?.[0]?.versions||[];
          assert.deepEqual(v.map(x=>x.version_id),[process.env.ORIGINAL_VERSION]);
          assert.equal(v[0].percentage,100);
          const d=await fetch(base+'/workers/domains',{headers});const domains=(await d.json()).result;
          for(const host of ['ronde-des-archanges-universelle.eu','www.ronde-des-archanges-universelle.eu'])
           assert.equal(domains.find(x=>x.hostname===host)?.service,'celebrations-exit-production');
          const q=await fetch(base+'/d1/database/28736d2a-479b-472b-bf82-703ad0affe10/query',{
           method:'POST',headers:{...headers,'content-type':'application/json'},
           body:JSON.stringify({sql:'SELECT id FROM celebrations_celebrations ORDER BY id'})});
          assert.equal(q.status,200);const row=(await q.json()).result?.[0]?.results||[];
          assert.ok(row.some(x=>String(x.id)==='101'),'Michaël 101 must survive; newer planned years are allowed');
          const s=await fetch(base+'/r2/buckets/celebrations-exit-staging/objects/editor-trials/server-drafts-v1.json',{headers});
          assert.equal(s.status,200);
          const state=await s.json();
          assert.ok(['published','hidden','draft'].includes(state.published?.celebrationVisibility?.['101']),'Michaël must retain an explicit visibility');
          assert.ok(state.published?.privateReleaseRevisions?.['101'],'Michaël must still be privately fenced');
          assert.ok(state.mediaCatalogue?.length>=128,'Historical media must remain; new uploads allowed');
          // One historic public image must still be retrievable on its original URL.
          const sample='https://ronde-des-archanges-universelle.eu/media/media/1791723108110/file-1791723109615-1000040461.jpg';
          const oldPhoto=await fetch(sample,{method:'HEAD',signal:AbortSignal.timeout(30000)});
          assert.equal(oldPhoto.status,200,'Historic public media path must survive');
          console.log('M032_GUARD_PASS official_worker_unchanged=true media_objects_preserved_min='+state.mediaCatalogue.length);
          NODE
      - name: Build and run publication, private security and visibility tests
        run: |
          set -euo pipefail
          node scripts/build-m012b-member-spaces-inline.mjs --check
          node scripts/build-m019-editor-client.mjs --check
          node --test tests/test_m032_standalone_public_media.mjs tests/test_m009c_public_media_api_security.mjs tests/test_m024_cleanup_and_media_safety.mjs tests/test_m031_m4_compact_layout.mjs tests/test_m031_published_visibility.mjs tests/test_m031_d1_visibility_route.mjs tests/test_m031_d1_session_renewal.mjs tests/test_m018_official_pin_bridge.mjs tests/test_m030_canonical_celebrations.mjs tests/test_m012c_private_editor_publication.mjs tests/test-editor-demo.mjs tests/test-editor-publication-media.mjs
          python scripts/build_production_assets.py
          test -s production-public/admin.html
          npm install --no-save --no-package-lock wrangler@4 playwright@1.58.2
          npx playwright install chromium
          node scripts/test-m031-m4-compact-browser.mjs
          node scripts/test-m032-media-browser.mjs
          (cd migration/cloudflare && npx wrangler deploy --dry-run --config wrangler.m018.official.toml)
          echo M032_BUILD_CHECK_PASS
      - name: Upload code candidate without changing official traffic
        id: upload
        working-directory: migration/cloudflare
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/m032-version-output.ndjson
        run: |
          set -euo pipefail
          npx wrangler versions upload --config wrangler.m018.official.toml --message "M032: standalone explicit public URLs without publishing celebrations"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,appendFileSync} from 'node:fs';
          const items=readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH,'utf8').split('\n').filter(Boolean).map(JSON.parse);
          const v=items.filter(x=>x.type==='version-upload'&&x.worker_name==='celebrations-exit-production').at(-1)?.version_id;
          assert.match(v||'',/^[a-f0-9-]{36}$/i);
          appendFileSync(process.env.GITHUB_OUTPUT,'new_version='+v+'\n');
          NODE
      - name: Verify original version still active then promote ONLY code
        id: promote
        working-directory: migration/cloudflare
        env:
          NEW_VERSION: ${{ steps.upload.outputs.new_version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
           '/workers/scripts/celebrations-exit-production/deployments',{
           headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
          assert.equal(r.status,200);const j=await r.json();assert.equal(j.success,true);
          assert.deepEqual(j.result.deployments[0].versions.map(x=>x.version_id),[process.env.ORIGINAL_VERSION]);
          NODE
          npx wrangler versions deploy "$NEW_VERSION@100%" --yes --config wrangler.m018.official.toml --message "M032 code-only media preview and standalone URL sharing; D1/R2 unchanged"
      - name: Confirm domain, access protections, visible Michaël and unchanged database
        env:
          NEW_VERSION: ${{ steps.upload.outputs.new_version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const dep=await fetch(base+'/workers/scripts/celebrations-exit-production/deployments',{headers});
          assert.equal(dep.status,200);
          const j=await dep.json();assert.equal(j.success,true);
          assert.deepEqual(j.result.deployments[0].versions.map(x=>x.version_id),[process.env.NEW_VERSION]);
          const s=await fetch(base+'/r2/buckets/celebrations-exit-staging/objects/editor-trials/server-drafts-v1.json',{headers});
          assert.equal(s.status,200);
          const state=await s.json();assert.ok(['published','hidden','draft'].includes(state.published?.celebrationVisibility?.['101']),'Michaël must retain an explicit visibility');
          assert.ok(state.mediaCatalogue.length>=128,'Keep historical media');
          const site='https://ronde-des-archanges-universelle.eu';
          const [home,anon,privateRoute,admin]=await Promise.all([
           fetch(site+'/?m032_recheck=1'),fetch(site+'/api/editor-open-draft?celebration=101'),
           fetch(site+'/api/admin/member-directory?action=snapshot'),fetch(site+'/admin')
          ]);
          assert.equal(home.status,200);assert.equal(anon.status,401);assert.equal(privateRoute.status,401);
          const privateD1=await fetch(site+'/api/admin/private-editor?celebration=101');
          const unshared=await fetch(site+'/media/new/00000000-0000-4000-8000-000000000000.jpg');
          assert.equal(unshared.status,404,'No automatic public access for unknown media');
          const publicPhoto=await fetch(site+'/media/media/1791723108110/file-1791723109615-1000040461.jpg',{method:'HEAD'});
          assert.equal(publicPhoto.status,200,'Old JPG links must remain accessible');
          const mediaApi=await fetch(site+'/api/editor-media?action=public-link',{
           method:'POST',headers:{'content-type':'application/json',origin:site},
           body:JSON.stringify({id:'image|/media/new/00000000-0000-4000-8000-000000000000.jpg',
             publicLink:true,expectedRevision:0})});
          assert.equal(mediaApi.status,401,'Anonymous write cannot publicize media');
          assert.equal(privateD1.status,401,'D1 private route remains protected by bearer');
          assert.equal(admin.status,200);
          console.log('M032_OFFICIAL_CODE_ONLY_SUCCESS new_version='+process.env.NEW_VERSION+' no_database_or_media_writes=true');
          NODE
      - name: Live read-only visitor check — full day row and menu hover
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1420,height:850}});
            const response=await page.goto('https://ronde-des-archanges-universelle.eu/?celebration=101&page=accueil-celebration',
              {waitUntil:'domcontentloaded',timeout:45000});
            assert.equal(response.status(),200);
            await page.waitForFunction(()=>document.querySelectorAll('#stage-navigation .stage-tab').length>=7,
              {timeout:25000});
            const values=await page.locator('#stage-navigation .stage-tab').evaluateAll(nodes=>nodes.map(el=>({
              y:Math.round(el.getBoundingClientRect().top),white:getComputedStyle(el).whiteSpace
            })));
            assert.equal(new Set(values.map(x=>x.y)).size,1,'Day buttons must stay on same desktop row');
            assert.ok(values.every(x=>x.white==='nowrap'));
            await page.locator('#menu-toggle').hover();
            await page.locator('#general-navigation').waitFor({state:'visible'});
            console.log('M032_VISITOR_LIVE_PASS day_count='+values.length+' hover_open=true');
          }finally{await browser.close()}
          NODE
      - name: Code rollback only if live check fails, never touch R2 or D1
        if: ${{ failure() && steps.promote.outcome == 'success' }}
        working-directory: migration/cloudflare
        env:
          NEW_VERSION: ${{ steps.upload.outputs.new_version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
           '/workers/scripts/celebrations-exit-production/deployments',{
           headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
          const j=await r.json();assert.equal(j.success,true);
          assert.deepEqual(j.result.deployments[0].versions.map(x=>x.version_id),[process.env.NEW_VERSION]);
          NODE
          npx wrangler versions deploy "$ORIGINAL_VERSION@100%" --yes --config wrangler.m018.official.toml --message "M032: guarded code-only rollback"
