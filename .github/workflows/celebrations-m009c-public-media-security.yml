name: "CÉLÉBRATIONS M009-C — public media and API security, offline only"
on:
  push:
    branches:
      - feat/celebrations-m009c-public-media-api-security-20261110
  pull_request:
    branches:
      - feat/celebrations-m008d-consolidation-008a-008b-008c-20261110
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-api-boundaries:
    name: M009-C — direct private media deny and public backward compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax (NO Cloudflare credentials)
        run: |
          node --check migration/cloudflare/media-gateway.mjs
          node --check migration/cloudflare/public-data-api.mjs
          node --check migration/cloudflare/public-upload-gateway.mjs
          node --check migration/cloudflare/app/security/public-media-boundary.mjs
          node --check migration/cloudflare/production-worker.mjs
          node --check migration/cloudflare/staging-worker.mjs
          node --check migration/cloudflare/readonly-preview-worker.mjs
          node --check migration/cloudflare/legacy-mailed-pdf-worker.mjs
          node --check tests/test_m009c_public_media_api_security.mjs
          python3 -m py_compile scripts/build_staging_assets.py
          python3 -m py_compile scripts/configure_staging_wrangler.py
      - name: Synthetic direct-access and history tests (NO R2/D1 writes)
        run: |
          node --test \
            tests/test_m009c_public_media_api_security.mjs \
            tests/test-exit-media-gateway.mjs \
            tests/test-exit-public-data.mjs \
            tests/test_m008c_private_server_access.mjs \
            tests/test_m008d_cross_integration.mjs \
            tests/test-exit-production-candidate.mjs \
            tests/test_mission14_editor_security.mjs \
            tests/test-editor-publication-media.mjs
      - name: Confirm no private member route has been enabled
        run: |
          if grep -q 'member-private-access.mjs' \
            migration/cloudflare/production-worker.mjs \
            migration/cloudflare/staging-worker.mjs; then
            echo 'UNEXPECTED_PRIVATE_ROUTE_IMPORT'
            exit 1
          fi
          echo 'M009C_PRIVATE_ROUTES=NOT_ENABLED'
