name: Copy Supabase media to R2 (manual)
on:
  workflow_dispatch:
    inputs:
      confirm_copy:
        description: "Type COPY to upload; leave empty to only list files"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: celebrations-r2-sync-${{ github.repository }}
  cancel-in-progress: false
jobs:
  copy:
    if: ${{ inputs.confirm_copy != 'COPY' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CONFIRM_COPY: ${{ inputs.confirm_copy }}
      DRY_RUN: ${{ inputs.confirm_copy == 'COPY' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install copy dependencies
        run: python -m pip install 'boto3>=1.35,<2' 'requests>=2.32,<3'
      - name: Validate execution mode
        shell: bash
        run: |
          if [[ "$DRY_RUN" == "false" && "$CONFIRM_COPY" != "COPY" ]]; then
            echo "Invalid copy confirmation"
            exit 1
          fi
      - name: Copy and verify (never delete)
        run: python scripts/copy_supabase_media_to_r2.py
