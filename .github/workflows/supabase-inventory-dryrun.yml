name: Supabase inventory dry-run (no R2 access)
on:
  push:
    branches:
      - chore/r2-copy-celebrations-20261012
    paths:
      - .github/workflows/supabase-inventory-dryrun.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ENDPOINT: https://example.invalid
      R2_ACCESS_KEY_ID: disabled
      R2_SECRET_ACCESS_KEY: disabled
      DRY_RUN: "true"
      CONFIRM_COPY: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only inventory dependencies
        run: python -m pip install 'boto3>=1.35,<2' 'requests>=2.32,<3'
      - name: Inventory Supabase without copying
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import collections
          import os
          import sys
          assert os.environ["DRY_RUN"] == "true"
          assert os.environ["CONFIRM_COPY"] != "COPY"
          spec = importlib.util.spec_from_file_location("inventory", "scripts/copy_supabase_media_to_r2.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          # Disable all R2 methods regardless of future script changes.
          class NoR2:
              def __getattr__(self, name):
                  raise RuntimeError("R2 access forbidden in inventory")
          mod.r2 = NoR2()
          # Restrict HTTP session to Supabase listing only.
          original_post = mod.session.post
          pages = [0]
          def listing_only(url, **kwargs):
              if url != f"{mod.URL}/storage/v1/object/list/{mod.BUCKET}":
                  raise RuntimeError("Unexpected HTTP endpoint")
              if kwargs.get("json", {}).get("limit") != 100:
                  raise RuntimeError("Unexpected listing page size")
              pages[0] += 1
              return original_post(url, **kwargs)
          mod.session.post = listing_only
          mod.session.get = lambda *a, **kw: (_ for _ in ()).throw(RuntimeError("Downloads forbidden"))
          mod.session.delete = lambda *a, **kw: (_ for _ in ()).throw(RuntimeError("Deletes forbidden"))
          total = 0
          size = 0
          folders = set()
          for path, entry in mod.objects():
              total += 1
              size += mod.source_size(entry)
              if "/" in path:
                  folders.add(path.rsplit("/", 1)[0])
          print(f"INVENTORY_FILES={total}")
          print(f"INVENTORY_BYTES={size}")
          print(f"INVENTORY_FOLDERS={len(folders)}")
          print(f"LISTING_REQUESTS={pages[0]}")
          if total == 0:
              sys.exit("Empty inventory")
          PY
