name: M014 final integration regression (local only)
on:
  push:
    branches: [feat/celebrations-m014-final-integration-20261111]
  pull_request:
    branches: [feat/celebrations-m013-functional-finalization-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-m012b-member-spaces-inline.mjs --check
      - run: node --test tests/test_m0*.mjs tests/test_mission002_member_access.mjs tests/test-exit-auth.mjs
      - run: node --test tests/test_mission*.mjs
  local-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock miniflare@4 esbuild@0.25 playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-m013-public-worker-editor.mjs
      - run: node scripts/test-m012d-real-worker-editor.mjs
      - run: node scripts/test-m008a-public-language-browser.mjs
