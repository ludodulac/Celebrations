name: R2-024 consistency tests
on:
  push:
    branches: [feat/r2-019-safe-preparation]
    paths:
      - scripts/r2_024_consistency.py
      - tests/test_r2_024_consistency.py
      - .github/workflows/r2-024-consistency-tests.yml
permissions:
  contents: read
concurrency:
  group: r2-024-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -p test_r2_024_consistency.py -v
