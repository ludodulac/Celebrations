name: "M048 temporary asset transfer test"
on:
  push:
    branches: [feat/m048-responsive-home-art-20261116]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe signed original size variants (no mutations)
        env:
          DESK: 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F2936b492-f772-41cb-b1bb-98c2d466b765/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAExwj3o_ij5ZZo4B6xKemo-__VTcQEEwwmgONjcN4Uvz&exp=1794882038&osig=AAAAAAAAAAAAAAAAAAAAAO30k8GB23NyynJkC_HcBxUwPxl9dFnw2B1NDQ1o1N0a&signer=media-rpc&token=AAIAAU0AJDI5MzZiNDkyLWY3NzItNDFjYi1iMWJiLTk4YzJkNDY2Yjc2NQAAAAABoedOaPD5KfzWX4jw-As1bt1edqq5ZD_zUmIKl7kBGCTMEOPV4g&x-canva-quality=thumbnail'
          MOBILE: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F584f836a-3321-4145-a212-74a3a1f148d1/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAACCiQF5etXakib0fZbTYd_buyaGrtQjOnXjXLd-GjHdw&exp=1794880041&osig=AAAAAAAAAAAAAAAAAAAAAOi1BoiZkt1tXxzhSP6Xtgd34N4aeatCZFxAo69oZTVy&signer=media-rpc&token=AAIAAU0AJDU4NGY4MzZhLTMzMjEtNDE0NS1hMjEyLTc0YTNhMWYxNDhkMQAAAAABoecv8CgErhA1T1H8urjWFio4CT2U4crIL83GVYtkra3U63Cl3w&x-canva-quality=thumbnail'
        run: |
          python3 - <<'PY'
          import os,urllib.request,urllib.error
          for key,src,old,new in [
            ('desktop',os.environ['DESK'],'height:112/','height:941/'),
            ('mobile',os.environ['MOBILE'],'height:200/','height:1672/')]:
            full=src.replace(old,new).replace('width:200','width:1672').replace('width:112','width:941')
            for label,url in [('thumbnail',src),('original-size',full)]:
              try:
                with urllib.request.urlopen(url,timeout=18) as r:
                  data=r.read()
                  print(key,label,r.status,r.headers.get('Content-Type'),len(data))
              except Exception as e:print(key,label,'FAILED',type(e).__name__,str(e)[:200])
          PY
