name: Apply D1 read optimizations to staging with strict FREE quota guards
on:
  push:
    branches: [feat/celebrations-supabase-exit-001]
    paths:
      - .github/workflows/celebrations-staging-quota-safe-optimize-once.yml
permissions:
  contents: read
concurrency:
  group: celebrations-staging-only
  cancel-in-progress: false
jobs:
  optimized-staging-only:
    if: github.ref == 'refs/heads/feat/celebrations-supabase-exit-001'
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guarantee scope is staging branch and isolated Cloudflare resources
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/celebrations-supabase-exit-001'
          test "$STAGING_R2_BUCKET" = celebrations-exit-staging
          python scripts/configure_staging_wrangler.py
          grep -Fq 'name = "celebrations-exit-staging"' migration/cloudflare/wrangler.toml
          grep -Fq 'bucket_name = "celebrations-exit-staging"' migration/cloudflare/wrangler.toml
          grep -Fq "$STAGING_D1_ID" migration/cloudflare/wrangler.toml
      - name: Check ALL Cloudflare D1 databases' daily READ and WRITE headroom (zero D1 queries)
        run: node scripts/check-staging-d1-free-budget.mjs pre
      - name: Validate JavaScript syntax and offline tests first
        run: |
          node --check migration/cloudflare/stats-api.mjs
          node --check migration/cloudflare/public-data-api.mjs
          node --test tests/test-exit-public-data.mjs tests/test-exit-stats.mjs tests/test-exit-d1-query-budget.mjs
      - name: Build staging static assets only
        run: python scripts/build_staging_assets.py
      - name: Install Wrangler (no SQL or deployment yet)
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Add four quota-saving indexes to STAGING D1 once
        working-directory: migration/cloudflare
        run: npx wrangler d1 execute celebrations-exit-staging --remote --file d1-quota-indexes.sql
      - name: Deploy ONLY isolated staging worker with indexed relations and cache
        working-directory: migration/cloudflare
        run: npx wrangler deploy --config wrangler.toml
      - name: Verify ONE small public response without replaying all browser/media audits
        shell: bash
        run: |
          node <<'NODE'
          const url="https://celebrations-exit-staging.rondes.workers.dev/api/public-data?table=celebrations_event_contents";
          const r=await fetch(url,{signal:AbortSignal.timeout(25000)});
          if(r.status!==200)throw Error("Staging relations HTTP status "+r.status);
          const rows=await r.json();
          if(!Array.isArray(rows)||rows.length<1||rows.length>1000)throw Error("Unexpected staging relation count");
          if(rows.some(x=>!("event_id" in x)||!("content_id" in x)||!("sort_order" in x)))
            throw Error("Incompatible relation shape");
          console.log("STAGING_QUOTA_SAFE_SMOKE rows="+rows.length+" calls_to_D1=1");
          NODE
      - name: Check final account-wide D1 quota without any new database reads
        if: always()
        run: node scripts/check-staging-d1-free-budget.mjs post
