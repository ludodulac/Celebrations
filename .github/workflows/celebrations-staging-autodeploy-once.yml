name: One-time isolated Cloudflare staging deployment and browser verification
# DAILY D1 FREE QUOTA GUARD: do not automatically run expensive staging HTTP
# audits or data writes on every code commit. Manual confirmation only.
on:
  workflow_dispatch:
    inputs:
      confirm_quota:
        description: Type RUN_STAGING after verifying daily D1 rows-read headroom
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: celebrations-staging-only
  cancel-in-progress: false
jobs:
  staging-only:
    if: github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && inputs.confirm_quota == 'RUN_STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: celebrations-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
      STAGING_ADMIN_HASH: ${{ secrets.CELEBRATIONS_STAGING_ADMIN_PASSWORD_HASH }}
      STAGING_ADMIN_SALT: ${{ secrets.CELEBRATIONS_STAGING_ADMIN_PASSWORD_SALT }}
    steps:
      - name: Checkout staging branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reject incorrect deployment resources
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/celebrations-supabase-exit-001"
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_D1_ID STAGING_R2_BUCKET STAGING_ADMIN_HASH STAGING_ADMIN_SALT; do
            [[ -n "${!var:-}" ]] || { echo "Missing staging configuration: $var"; exit 1; }
          done
          [[ "$STAGING_R2_BUCKET" == "celebrations-exit-staging" ]]
      - name: Require view-only admin screens before uploading
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path("admin-celebrations.js").read_text()
          d=Path("admin-date-rules.js").read_text()
          m=Path("admin-v3.js").read_text()
          view=c.split("editCelebration=function(id)",1)[1].split("saveC.onclick",1)[0]
          assert "saveState(state)" not in view, "Opening a celebration still saves all D1 content"
          programme=d.split("renderProgram=function()",1)[1].split("dayCard=function",1)[0]
          assert "saveState(state)" not in programme, "Viewing the programme still saves D1"
          media_form=m.split("function renderMediaForm(type)",1)[1].split("function ",1)[0]
          assert "saveState(state)" not in media_form, "Opening the media chooser still saves D1"
          print("STAGING_VIEW_ONLY_ADMIN_GUARD_OK")
          PY
      - name: Ensure changes pass staging unit and integration tests
        run: |
          node --test tests/test-exit-media-gateway.mjs tests/test-exit-public-data.mjs tests/test-exit-auth.mjs tests/test-exit-staging-integration.mjs tests/test-exit-preview-client.mjs tests/test-exit-client-isolation.mjs tests/test-exit-footer-admin.mjs tests/test-exit-participants-admin.mjs tests/test-exit-safe-save-sqlite.mjs
      - name: Build Cloudflare-only static assets
        run: python scripts/build_staging_assets.py
      - name: Verify no legacy image or Supabase SDK in staging pages
        shell: bash
        run: |
          grep -Fq 'src="/media/media/celebrations-staging-welcome-autumn-2026.jpg"' staging-public/index.html
          if grep -q 'cdn.jsdelivr.net/npm/@supabase/supabase-js' staging-public/index.html staging-public/admin.html; then exit 1; fi
      - name: Install Wrangler and configure isolated bindings
        run: |
          npm install --no-save --no-package-lock wrangler@4
          python scripts/configure_staging_wrangler.py
      - name: Ensure D1 schema exists only on staging
        working-directory: migration/cloudflare
        run: |
          npx wrangler d1 execute celebrations-exit-staging --remote --file celebrations-schema.sql
          npx wrangler d1 execute celebrations-exit-staging --remote --file media-acl.sql
      - name: Configure staging admin secrets only
        working-directory: migration/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          printf %s "$STAGING_ADMIN_HASH" | npx wrangler secret put ADMIN_PASSWORD_HASH --name celebrations-exit-staging
          printf %s "$STAGING_ADMIN_SALT" | npx wrangler secret put ADMIN_PASSWORD_SALT --name celebrations-exit-staging
      - name: Deploy staging worker only
        working-directory: migration/cloudflare
        run: npx wrangler deploy --config wrangler.toml
      - name: Verify deployed public data, admin protection and media over HTTP
        run: |
          node scripts/verify-staging-media-http.mjs
          node scripts/verify-staging-public-http.mjs
      - name: Install headless Chromium for final browser check
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify rendered website never contacts Supabase
        env:
          REQUIRE_CLOUDFLARE_ONLY: "1"
        run: node scripts/verify-staging-browser.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only admin browser audit dependency
        run: python -m pip install 'requests>=2.32,<3'
      - name: Verify authenticated administration plus reversible participant registration and login
        env:
          STAGING_SYNTHETIC_PARTICIPANT_WRITE: "1"
        run: python scripts/verify-staging-authenticated-admin.py
# Second isolated staging run: verify deferred admin initialisation after real Chromium stack trace.
