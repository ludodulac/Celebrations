name: "Célébrations M020-E — préproduction Cloudflare M016 uniquement"
on:
  push:
    branches: [feat/m020e-consolidation-abcd-20261111]
permissions:
  contents: read
  actions: read
concurrency:
  group: celebrations-m020e-m016-preview-only
  cancel-in-progress: false
jobs:
  isolated-m016-only:
    if: ${{ github.run_attempt == 1 && contains(github.event.head_commit.message, '[M020E_ISOLATED_PREVIEW]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: celebrations-staging
    env:
      M020E_ISOLATED_ONLY: 'YES'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      M017_ADMIN_PASSWORD: ${{ secrets.CELEBRATIONS_M017_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Hard gate — correct isolated M016 bindings, record official and M016 versions
        id: baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/m020e-consolidation-abcd-20261111'
          test "$M020E_ISOLATED_ONLY" = 'YES'
          test "$CLOUDFLARE_ACCOUNT_ID" = '60a7b17758a93fe6681ce998e72ddff0'
          test "${#M017_ADMIN_PASSWORD}" -ge 16
          ! grep -Eq '^[[:space:]]*(route|routes|zone_id|custom_domain)[[:space:]]*=' migration/cloudflare/wrangler.m018.existing-preprod.toml
          grep -Fq 'name = "celebrations-m016-admin-preprod"' migration/cloudflare/wrangler.m018.existing-preprod.toml
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync,appendFileSync} from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          assert.ok(token?.length>20);
          const api=async path=>{
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+path,{
              headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(25000)});
            assert.equal(r.status,200,path+' HTTP');
            const j=await r.json();assert.equal(j.success,true);return j.result;
          };
          const settings=await api('/workers/scripts/celebrations-m016-admin-preprod/settings');
          const binds=new Map((settings.bindings||[]).map(x=>[x.name,x]));
          for(const name of ['DB','MEDIA_ACL'])assert.equal(binds.get(name)?.id||binds.get(name)?.database_id,
            '3bb4108f-5ff8-4959-ba32-bd53f33156cb',name+' must be M016 D1');
          assert.equal(binds.get('EDITOR_BUCKET')?.bucket_name,'celebrations-m016-admin-editor');
          assert.equal(binds.get('MEDIA_BUCKET')?.bucket_name,'celebrations-m016-admin-media');
          for(const name of ['ADMIN_PASSWORD_HASH','ADMIN_PASSWORD_SALT','M016_PIN_SALT','M016_PIN_VERIFIER','EDITOR_D1_CHALLENGE_SECRET'])
            assert.equal(binds.get(name)?.type,'secret_text','Retain protected credential '+name);
          const versions=async name=>{
            const d=await api('/workers/scripts/'+name+'/deployments');
            const v=d.deployments?.[0]?.versions||[];
            assert.equal(v.length,1);assert.equal(v[0].percentage,100);return v[0].version_id;
          };
          const production=await versions('celebrations-exit-production');
          const m016=await versions('celebrations-m016-admin-preprod');
          writeFileSync('/tmp/m020e-official-baseline.txt',production);
          appendFileSync(process.env.GITHUB_OUTPUT,'prior_m016='+m016+'\n');
          console.log('M020E_BOUNDARY_PASS official_preserved=true target=M016 isolated_D1=true');
          NODE
      - name: Build checks and synthetic-only regressions BEFORE touching M016
        run: |
          set -euo pipefail
          node scripts/build-m012b-member-spaces-inline.mjs --check
          node scripts/build-m019-editor-client.mjs --check
          node --check migration/cloudflare/editor-trial-site-client.mjs
          node --check migration/cloudflare/editor-publication-api.mjs
          node --test tests/test_m020e_integrated_migrations.mjs tests/test_m020d_member_brevo.mjs tests/test_m020a_visitor_languages.mjs tests/test-m020c-media-range.mjs
          python scripts/build_production_assets.py
          test -s production-public/admin.html
      - name: Prepare installed Wrangler and isolated browser in advance
        run: |
          npm install --no-save --no-package-lock wrangler@4 playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Export M016 D1 before the two additive migrations, never production D1
        working-directory: migration/cloudflare
        run: |
          set -euo pipefail
          umask 077
          npx wrangler d1 export celebrations-m016-admin-preprod --remote --config wrangler.m018.existing-preprod.toml --output /tmp/m020e-m016-pre-migration.sql
          test -s /tmp/m020e-m016-pre-migration.sql
          sha256sum /tmp/m020e-m016-pre-migration.sql | sed 's#/tmp/##'
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in /tmp/m020e-m016-pre-migration.sql \
            -out /tmp/m020e-m016-pre-migration.sql.enc \
            -pass env:M017_ADMIN_PASSWORD
          test -s /tmp/m020e-m016-pre-migration.sql.enc
      - uses: actions/upload-artifact@v4
        with:
          name: m020e-M016-D1-backup-encrypted
          path: /tmp/m020e-m016-pre-migration.sql.enc
          retention-days: 7
          if-no-files-found: error
      - name: Apply B and D ADDITIVE migrations only on M016 after verified encrypted backup
        working-directory: migration/cloudflare
        run: |
          set -euo pipefail
          CFG=wrangler.m018.existing-preprod.toml
          DB=celebrations-m016-admin-preprod
          npx wrangler d1 execute "$DB" --remote --config "$CFG" \
            --command "PRAGMA table_info(celebrations_directory_member_types)" --json >/tmp/m020e-columns.json
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const j=JSON.parse(readFileSync('/tmp/m020e-columns.json','utf8'));
          const rows=Array.isArray(j)?j.flatMap(x=>x.results||[]):j.results||[];
          if(!rows.some(r=>r.name==='name'))throw Error('M016 directory schema missing');
          writeFileSync('/tmp/m020e-apply-b',rows.some(r=>r.name==='abbreviation')?'no':'yes');
          NODE
          if test "$(cat /tmp/m020e-apply-b)" = yes; then
            npx wrangler d1 execute "$DB" --remote --config "$CFG" \
              --file d1-migrations/20261111_020b_category_abbreviation.sql
          fi
          npx wrangler d1 execute "$DB" --remote --config "$CFG" \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'celebrations_member_%'" --json >/tmp/m020e-member-tables.json
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const j=JSON.parse(readFileSync('/tmp/m020e-member-tables.json','utf8'));
          const rows=Array.isArray(j)?j.flatMap(x=>x.results||[]):j.results||[];
          const actual=new Set(rows.map(r=>r.name));
          const expected=['celebrations_member_invitation_bindings','celebrations_member_email_tokens',
            'celebrations_member_mail_events','celebrations_member_mail_quota'];
          const present=expected.filter(x=>actual.has(x)).length;
          if(present!==0&&present!==expected.length)throw Error('M016 member migration only partially applied; refuse further writes');
          writeFileSync('/tmp/m020e-apply-d',present===0?'yes':'no');
          NODE
          if test "$(cat /tmp/m020e-apply-d)" = yes; then
            npx wrangler d1 execute "$DB" --remote --config "$CFG" \
              --file d1-migrations/20261111_020d_member_brevo.sql
          fi
          rm -f /tmp/m020e-m016-pre-migration.sql
          echo 'M020E_M016_ONLY_ADDITIVE_MIGRATIONS_DONE'
      - name: Deploy only existing M016 worker (no routes or production secrets)
        id: deploy
        working-directory: migration/cloudflare
        run: |
          npx wrangler deploy --config wrangler.m018.existing-preprod.toml
          echo M020E_M016_WORKER_ONLY_UPDATED
      - name: Online 390px Chromium, PIN, site, media, member and refused private access
        run: node scripts/test-m020e-existing-m016-online.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m020e-real-M016-smartphone-captures
          path: docs/m020e-smartphone
          if-no-files-found: ignore
      - name: Confirm production Worker did not change
        if: always()
        run: |
          if test -f /tmp/m020e-official-baseline.txt; then
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/celebrations-exit-production/deployments',{
            headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(25000)});
          assert.equal(r.status,200);
          const j=await r.json();assert.equal(j.success,true);
          const v=j.result?.deployments?.[0]?.versions||[];
          assert.equal(v.length,1);
          assert.equal(v[0].version_id,readFileSync('/tmp/m020e-official-baseline.txt','utf8'));
          console.log('M020E_OFFICIAL_WORKER_UNCHANGED_PASS');
          NODE
          fi
      - name: Roll back ONLY M016 Worker if live preproduction smoke fails
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        env:
          OLD_M016_VERSION: ${{ steps.baseline.outputs.prior_m016 }}
        working-directory: migration/cloudflare
        run: |
          set -euo pipefail
          test -n "$OLD_M016_VERSION"
          npx wrangler versions deploy "${OLD_M016_VERSION}@100%" --yes \
            --config wrangler.m018.existing-preprod.toml \
            --message "M020-E: restore old isolated M016 worker after failed preview"
