name: CELEBRATIONS ACCESS-PERMANENT - staged isolated deployment (fictional auth tests)
on:
  push:
    branches: [feat/celebrations-admin-visual-mission-e2a-access]
    paths: [.github/workflows/celebrations-admin-access-permanent-once.yml]
permissions:
  contents: read
concurrency:
  group: celebrations-staging-only
  cancel-in-progress: false
jobs:
  access:
    if: github.ref == 'refs/heads/feat/celebrations-admin-visual-mission-e2a-access'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    environment: celebrations-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Guard staging only and validate permanent access module
        shell: bash
        run: |
          set -euo pipefail
          test "$STAGING_D1_ID" = 0f761662-241f-42cc-ac94-5c68b4aa7797
          test "$STAGING_D1_ID" != 28736d2a-479b-472b-bf82-703ad0affe10
          test "$STAGING_R2_BUCKET" = celebrations-exit-staging
          node --check migration/cloudflare/editor-permanent-access.mjs
          node --check migration/cloudflare/staging-worker.mjs
          node --check migration/cloudflare/editor-e1-api.mjs
          node --check migration/cloudflare/editor-e1-page.mjs
          node --check migration/cloudflare/editor-e1-client.mjs
          node --check migration/cloudflare/editor-d4-access.mjs
          node --check migration/cloudflare/editor-e2a-access-recovery.mjs
          node --input-type=module <<'NODE'
          import {E1_CLIENT} from './migration/cloudflare/editor-e1-client.mjs';
          import {writeFileSync} from 'node:fs';
          writeFileSync('/tmp/celebrations-e2a-client-check.js',E1_CLIENT);
          NODE
          node --check /tmp/celebrations-e2a-client-check.js
      - name: FIRST local regression tests — fictive data only, no staging writes
        run: |
          node --test tests/test-editor-b-foundations.mjs tests/test-editor-c-converter.mjs tests/test-editor-d-preview.mjs tests/test-editor-d2-media.mjs tests/test-editor-d4-access.mjs tests/test-editor-e1.mjs tests/test-editor-e2a-access.mjs tests/test-editor-permanent-access.mjs
      - name: Install Wrangler only (no live-password testing)
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Verify actual deployed staging bindings before any deployment
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/celebrations-exit-staging/settings';
          const resp=await fetch(url,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
          assert.equal(resp.status,200);
          const payload=await resp.json();assert.equal(payload.success,true);
          const bs=payload.result.bindings,d1=bs.filter(x=>x.type==='d1'),r2=bs.filter(x=>x.type==='r2_bucket');
          assert.deepEqual(d1.map(x=>x.name).sort(),['DB','MEDIA_ACL']);
          assert.ok(d1.every(x=>(x.database_id||x.id)==='0f761662-241f-42cc-ac94-5c68b4aa7797'));
          assert.equal(r2.length,1);assert.equal(r2[0].bucket_name,'celebrations-exit-staging');
          assert.equal(bs.filter(x=>['service','dispatch_namespace'].includes(x.type)).length,0);
          assert.ok(bs.some(x=>x.name==='ADMIN_D4_ACCESS_HASH')); // Existing staging binding; never copied into new login.
          console.log('MISSION_ACCESS_PERMANENT_STAGING_BINDINGS_PASS');
          NODE
      - name: Check free plan budget before staging deploy (read only)
        run: node scripts/check-staging-d1-free-budget.mjs pre
      - name: Build unchanged staging assets and staging-only config
        run: |
          python scripts/build_staging_assets.py
          python scripts/configure_staging_wrangler.py
      - name: Deploy only password access code to isolated staging; leave unconfigured until owner sets secrets
        working-directory: migration/cloudflare
        run: npx wrangler deploy --config wrangler.toml
      - name: Production guard and anonymous editing denied; no source data changes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin='https://celebrations-exit-staging.rondes.workers.dev';
          const r=await fetch(origin+'/api/editor-e1?key=home',{cache:'no-store'});
          assert.equal(r.status,401);
          const deny=await fetch(origin+'/api/editor-e1',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'save',key:'home',expected_version:1,changes:[],paragraph_text:'should never be stored'})});
          assert.equal(deny.status,401);
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database/'+process.env.STAGING_D1_ID+'/query';
          const sql="SELECT (SELECT COUNT(*) FROM editor_c_imports) AS pages, (SELECT COUNT(*) FROM editor_b_pages WHERE published_version IS NOT NULL) AS published, (SELECT COUNT(*) FROM editor_c_blocks b JOIN editor_b_pages p ON b.page_id=p.id AND b.version=p.draft_version) AS historical_blocks";
          const q=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'},body:JSON.stringify({sql})});
          assert.equal(q.status,200);
          const out=await q.json();assert.equal(out.success,true);
          const row=out.result[0].results[0];
          assert.deepEqual([row.pages,row.published,row.historical_blocks],[47,0,327]);
          console.log('MISSION_ACCESS_PERMANENT_AFTER_PASS pages=47 historical_blocks=327 publications=0 unauthorized_401=true');
          NODE
      - name: Permanent login is fail-closed before owner config; logout remains gated
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://celebrations-exit-staging.rondes.workers.dev';
          const config=await fetch(url+'/__editor/access/config',{cache:'no-store'});
          assert.ok([200,503].includes(config.status),'Config endpoint must be available and fail closed if secret missing');
          if(config.status===200){
           const d=await config.json();assert.match(d.salt,/^[a-f0-9]{32}$/);
           assert.ok(!JSON.stringify(d).includes('STAGING_ADMIN_PASSWORD_VERIFIER'));
          }
          const denied=await fetch(url+'/api/editor-e1?key=home',{cache:'no-store'});
          assert.equal(denied.status,401);
          const setup=await fetch(url+'/__editor/access/setup',{cache:'no-store'});
          assert.equal(setup.status,200);
          assert.ok((await setup.text()).includes('STAGING_ADMIN_PASSWORD_VERIFIER'));
          console.log('ACCESS_PERMANENT_STAGING_FAIL_CLOSED_AND_SETUP_READY');
          NODE
      - name: Free plan quota post-check
        if: always()
        run: node scripts/check-staging-d1-free-budget.mjs post


# Campaign 2/2: match browser SHA256(PBKDF2 raw bytes) with protected server verifier.
