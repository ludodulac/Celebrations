name: "CÉLÉBRATIONS M006 — navigation multilingue sans déploiement"
on:
  push:
    branches:
      - feat/celebrations-m006-public-language-navigation-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m006-native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe des modules dédiés M006
        run: |
          node --check migration/cloudflare/app/domain/public-language-navigation.mjs
          node --check migration/cloudflare/app/application/public-language-selector.mjs
      - name: M002 M003 M004 M005 et M006 — tests sans publication
        run: |
          node --test \
            tests/test_mission002_member_access.mjs \
            tests/test_m003_localization.mjs \
            tests/test_m004_page_localization.mjs \
            tests/test_m005_celebration_spaces.mjs \
            tests/test_m006_public_language_navigation.mjs \
            tests/test_m006_language_selector.mjs
