name: "M036 — pages harmonisées, image entière et commandes simplifiées (officiel)"
on:
  push:
    branches: [feat/m036-unified-pages-menu-polish-20261113]
permissions: {contents: read}
concurrency:
  group: celebrations-existing-official-production-release
  cancel-in-progress: false
jobs:
  visibility-official:
    if: ${{ github.run_attempt == 1 && contains(github.event.head_commit.message, '[M036_OFFICIAL]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: celebrations-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      ORIGINAL_VERSION: '15e3472f-60f1-45c0-8b72-bc956bd4c330'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # Triggered after M035 PC/Android and API tests succeeded.
      # M036 approved by site owner. New code only: no changes to saved
      # celebrations, language versions, D1, R2 objects or membership ACL.
      - name: Exact official read-only gate — no data edits
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/m036-unified-pages-menu-polish-20261113'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const acct=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          assert.equal(acct,'60a7b17758a93fe6681ce998e72ddff0');
          assert.ok(token?.length>20);
          const base='https://api.cloudflare.com/client/v4/accounts/'+acct;
          const headers={authorization:'Bearer '+token};
          const r=await fetch(base+'/workers/scripts/celebrations-exit-production/deployments',{headers});
          assert.equal(r.status,200);const j=await r.json();assert.equal(j.success,true);
          const v=j.result?.deployments?.[0]?.versions||[];
          assert.deepEqual(v.map(x=>x.version_id),[process.env.ORIGINAL_VERSION]);
          assert.equal(v[0].percentage,100);
          const d=await fetch(base+'/workers/domains',{headers});const domains=(await d.json()).result;
          for(const host of ['ronde-des-archanges-universelle.eu','www.ronde-des-archanges-universelle.eu'])
           assert.equal(domains.find(x=>x.hostname===host)?.service,'celebrations-exit-production');
          const q=await fetch(base+'/d1/database/28736d2a-479b-472b-bf82-703ad0affe10/query',{
           method:'POST',headers:{...headers,'content-type':'application/json'},
           body:JSON.stringify({sql:'SELECT id FROM celebrations_celebrations ORDER BY id'})});
          assert.equal(q.status,200);const row=(await q.json()).result?.[0]?.results||[];
          assert.ok(row.some(x=>String(x.id)==='101'),'Michaël 101 must survive; newer planned years are allowed');
          const s=await fetch(base+'/r2/buckets/celebrations-exit-staging/objects/editor-trials/server-drafts-v1.json',{headers});
          assert.equal(s.status,200);
          const state=await s.json();
          assert.ok(['published','hidden','draft'].includes(state.published?.celebrationVisibility?.['101']),'Michaël must retain an explicit visibility');
          assert.ok(state.published?.privateReleaseRevisions?.['101'],'Michaël must still be privately fenced');
          assert.ok(Array.isArray(state.mediaCatalogue),'Media catalogue must be present');
          // Compare CURRENT production state, not an obsolete historical count.
          // The owner may have removed an unused image since the last deployment.
          const {writeFileSync}=await import('node:fs');
          writeFileSync(process.env.RUNNER_TEMP+'/m034-live-media-count',String(state.mediaCatalogue.length));
          // One historic public image must still be retrievable on its original URL.
          const sample='https://ronde-des-archanges-universelle.eu/media/media/1791723108110/file-1791723109615-1000040461.jpg';
          const oldPhoto=await fetch(sample,{method:'HEAD',signal:AbortSignal.timeout(30000)});
          assert.equal(oldPhoto.status,200,'Historic public media path must survive');
          // Verify the existing public homepage really has an image or brand image
          // before changing what visitors see. No user media bytes logged.
          const homeId=state.published?.shared?.homeId||'neutral-accueil-general';
          const home=state.published?.shared?.pages?.find(p=>p?.id===homeId);
          const hasImage=JSON.stringify(home?.blocks||[]).includes('"kind":"image"')||
           !!state.siteIdentity?.imageSrc;
          assert.ok(hasImage,'No published homepage/branding image found; refuse production change');
          console.log('M036_GUARD_PASS homepage_existing_image=true data_writes=0 media_count='+state.mediaCatalogue.length);
          NODE
      - name: Build and run publication, private security and visibility tests
        run: |
          set -euo pipefail
          node scripts/build-m012b-member-spaces-inline.mjs --check
          node scripts/build-m019-editor-client.mjs --check
          node --test tests/test_m036_unified_pages_and_ergonomics.mjs tests/test_m035_welcome_home_button.mjs tests/test_m034_menu_label_title_independence.mjs tests/test_m032_standalone_public_media.mjs tests/test_m009c_public_media_api_security.mjs tests/test_m024_cleanup_and_media_safety.mjs tests/test_m031_m4_compact_layout.mjs tests/test_m031_published_visibility.mjs tests/test_m031_d1_visibility_route.mjs tests/test_m031_d1_session_renewal.mjs tests/test_m018_official_pin_bridge.mjs tests/test_m030_canonical_celebrations.mjs tests/test_m012c_private_editor_publication.mjs tests/test-editor-demo.mjs tests/test-editor-publication-media.mjs
          python scripts/build_production_assets.py
          test -s production-public/admin.html
          npm install --no-save --no-package-lock wrangler@4 playwright@1.58.2
          npx playwright install chromium
          node scripts/test-m031-m4-compact-browser.mjs
          node scripts/test-m032-media-browser.mjs
          node scripts/test-m036-unified-pages-browser.mjs
          (cd migration/cloudflare && npx wrangler deploy --dry-run --config wrangler.m018.official.toml)
          echo M036_BUILD_CHECK_PASS
      - name: Upload code candidate without changing official traffic
        id: upload
        working-directory: migration/cloudflare
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/m036-version-output.ndjson
        run: |
          set -euo pipefail
          npx wrangler versions upload --config wrangler.m018.official.toml --message "M036: common page dimensions, uncropped photos, correct visitor order and editor ergonomics"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,appendFileSync} from 'node:fs';
          const items=readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH,'utf8').split('\n').filter(Boolean).map(JSON.parse);
          const v=items.filter(x=>x.type==='version-upload'&&x.worker_name==='celebrations-exit-production').at(-1)?.version_id;
          assert.match(v||'',/^[a-f0-9-]{36}$/i);
          appendFileSync(process.env.GITHUB_OUTPUT,'new_version='+v+'\n');
          NODE
      - name: Verify original version still active then promote ONLY code
        id: promote
        working-directory: migration/cloudflare
        env:
          NEW_VERSION: ${{ steps.upload.outputs.new_version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
           '/workers/scripts/celebrations-exit-production/deployments',{
           headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
          assert.equal(r.status,200);const j=await r.json();assert.equal(j.success,true);
          assert.deepEqual(j.result.deployments[0].versions.map(x=>x.version_id),[process.env.ORIGINAL_VERSION]);
          NODE
          npx wrangler versions deploy "$NEW_VERSION@100%" --yes --config wrangler.m018.official.toml --message "M036 code-only unified page geometry and admin shortcuts; D1/R2 unchanged"
      - name: Confirm domain, access protections, visible Michaël and unchanged database
        env:
          NEW_VERSION: ${{ steps.upload.outputs.new_version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const dep=await fetch(base+'/workers/scripts/celebrations-exit-production/deployments',{headers});
          assert.equal(dep.status,200);
          const j=await dep.json();assert.equal(j.success,true);
          assert.deepEqual(j.result.deployments[0].versions.map(x=>x.version_id),[process.env.NEW_VERSION]);
          const s=await fetch(base+'/r2/buckets/celebrations-exit-staging/objects/editor-trials/server-drafts-v1.json',{headers});
          assert.equal(s.status,200);
          const state=await s.json();assert.ok(['published','hidden','draft'].includes(state.published?.celebrationVisibility?.['101']),'Michaël must retain an explicit visibility');
          const {readFileSync}=await import('node:fs');
          const previously=Number(readFileSync(process.env.RUNNER_TEMP+'/m034-live-media-count','utf8'));
          assert.equal(state.mediaCatalogue.length,previously,'The code deployment must not alter R2 media inventory');
          const site='https://ronde-des-archanges-universelle.eu';
          const [home,anon,privateRoute,admin]=await Promise.all([
           fetch(site+'/?m036_recheck=1'),fetch(site+'/api/editor-open-draft?celebration=101'),
           fetch(site+'/api/admin/member-directory?action=snapshot'),fetch(site+'/admin')
          ]);
          assert.equal(home.status,200);assert.equal(anon.status,401);assert.equal(privateRoute.status,401);
          const privateD1=await fetch(site+'/api/admin/private-editor?celebration=101');
          const unshared=await fetch(site+'/media/new/00000000-0000-4000-8000-000000000000.jpg');
          assert.equal(unshared.status,404,'No automatic public access for unknown media');
          const publicPhoto=await fetch(site+'/media/media/1791723108110/file-1791723109615-1000040461.jpg',{method:'HEAD'});
          assert.equal(publicPhoto.status,200,'Old JPG links must remain accessible');
          const mediaApi=await fetch(site+'/api/editor-media?action=public-link',{
           method:'POST',headers:{'content-type':'application/json',origin:site},
           body:JSON.stringify({id:'image|/media/new/00000000-0000-4000-8000-000000000000.jpg',
             publicLink:true,expectedRevision:0})});
          assert.equal(mediaApi.status,401,'Anonymous write cannot publicize media');
          assert.equal(privateD1.status,401,'D1 private route remains protected by bearer');
          assert.equal(admin.status,200);
          console.log('M036_OFFICIAL_CODE_ONLY_SUCCESS new_version='+process.env.NEW_VERSION+' no_database_or_media_writes=true');
          NODE
      - name: Live read-only visitor check — full day row and menu hover
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1420,height:850}});
            const response=await page.goto('https://ronde-des-archanges-universelle.eu/?celebration=101&page=accueil-celebration',
              {waitUntil:'domcontentloaded',timeout:45000});
            assert.equal(response.status(),200);
            await page.waitForFunction(()=>document.querySelectorAll('#stage-navigation .stage-tab').length>=7,
              {timeout:25000});
            const values=await page.locator('#stage-navigation .stage-tab').evaluateAll(nodes=>nodes.map(el=>({
              y:Math.round(el.getBoundingClientRect().top),white:getComputedStyle(el).whiteSpace
            })));
            assert.equal(new Set(values.map(x=>x.y)).size,1,'Day buttons must stay on same desktop row');
            assert.ok(values.every(x=>x.white==='nowrap'));
            await page.locator('#menu-toggle').hover();
            await page.locator('#general-navigation').waitFor({state:'visible'});
            console.log('M036_VISITOR_LIVE_PASS day_count='+values.length+' hover_open=true');
          }finally{await browser.close()}
          NODE
      - name: Live official same-size pages, original Welcome, no image crop and admin login eye
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const site='https://ronde-des-archanges-universelle.eu';
          const publicResponse=await fetch(site+'/api/editor-publication?celebration=101');
          assert.equal(publicResponse.status,200);
          const published=await publicResponse.json();
          const general=published.shared?.pages||[];
          const homeId='neutral-accueil-general';
          const home=general.find(p=>p.id===homeId);
          assert.ok(home,'Official shared home is still the same');
          const hasTitle=home.blocks.some(b=>b.kind==='text'&&String(b.text).trim()==='Bienvenue');
          const browser=await chromium.launch({headless:true});
          try{
           for(const [w,h] of [[1366,810],[390,844]]){
            const context=await browser.newContext({viewport:{width:w,height:h},
             hasTouch:w<700,isMobile:w<700});
            const page=await context.newPage();
            const res=await page.goto(site+'/',{waitUntil:'domcontentloaded',timeout:45000});
            assert.equal(res.status(),200);
            const paper=page.locator('#site-paper'),photo=page.locator('.m033-splash-enter img');
            await photo.waitFor({state:'visible',timeout:25000});
            const bounds=await paper.boundingBox(),imgBounds=await photo.boundingBox();
            assert.ok(bounds&&imgBounds&&Math.abs(bounds.width-imgBounds.width)<2,
             'Home image reaches both sides of the SAME central page');
            assert.ok(bounds.width<=940,'Same maximum page width on desktop and phone');
            const dims=await photo.evaluate(async img=>{
             await img.decode().catch(()=>{});
             return {w:img.naturalWidth,h:img.naturalHeight,
              shownW:img.getBoundingClientRect().width,
              shownH:img.getBoundingClientRect().height,
              fit:getComputedStyle(img).objectFit}
            });
            assert.ok(dims.w>0&&dims.h>0,'Existing image decoded');
            assert.equal(dims.fit,'contain','Image is not cropped');
            assert.ok(Math.abs(dims.shownH-dims.shownW*dims.h/dims.w)<2,'Native image aspect ratio');
            if(hasTitle){
             const text=page.locator('.m034-home-flow .trial-paragraph').filter({hasText:'Bienvenue'});
             assert.ok(await text.count()>0,'The editor-authored Welcome was not hidden');
             assert.ok(await text.first().isVisible());
            }
            assert.ok(await page.locator('.m035-welcome-button').isVisible(),
             'The independent overlay button still exists');
            assert.equal(await page.locator('.site-menu-group').isVisible(),false,
             'Menu stays hidden on homepage only');
            assert.ok(await page.locator('#back-admin').isVisible());
            await page.locator('.m035-welcome-button').click();
            await page.locator('.site-menu-group').waitFor({state:'visible'});
            const second=await paper.boundingBox();
            assert.ok(Math.abs(second.width-bounds.width)<2,
             'Next page must have same central width as homepage');
            assert.ok(second.height>=Math.min(510,h*.66)-6,
             'Short pages retain an actual minimum page surface');
            await page.locator('#menu-toggle').click();
            const items=(await page.locator('#general-navigation .general-tab').allTextContents()).map(x=>x.trim());
            console.log('M036_PUBLIC_MENU_ORDER width='+w+' items='+JSON.stringify(items));
            const celebration=items.findIndex(t=>t.includes('Célébrations'));
            const media=items.findIndex(t=>t.includes('Médiathèque'));
            assert.ok(celebration>=1&&media>celebration);
            assert.ok(items.slice(1,celebration).length>=1,
             'Published user pages are listed before celebrations/media');
            console.log('M036_LIVE_PASS width='+w+
             ' authored_title=true no_crop=true same_paper=true author_pages_first=true');
            await context.close();
           }
          }finally{await browser.close()}
          const admin=await fetch(site+'/admin.html');
          assert.equal(admin.status,200);
          const login=await admin.text();
          assert.ok(login.includes('id="pin-eye"'),'Admin login must include show/hide code eye');
          console.log('M036_LIVE_LOGIN_EYE_PASS');
          NODE
      - name: Code rollback only if live check fails, never touch R2 or D1
        if: ${{ failure() && steps.promote.outcome == 'success' }}
        working-directory: migration/cloudflare
        env:
          NEW_VERSION: ${{ steps.upload.outputs.new_version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
           '/workers/scripts/celebrations-exit-production/deployments',{
           headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
          const j=await r.json();assert.equal(j.success,true);
          assert.deepEqual(j.result.deployments[0].versions.map(x=>x.version_id),[process.env.NEW_VERSION]);
          NODE
          npx wrangler versions deploy "$ORIGINAL_VERSION@100%" --yes --config wrangler.m018.official.toml --message "M036: guarded code-only rollback"
