name: Célébrations — simplifier uniquement les PDF externes avec aperçu en double
on:
  push:
    branches: [content/celebrations-pdf-external-buttons-20261110]
    paths:
      - 'scripts/michael-external-pdf-buttons-once.py'
      - '.github/workflows/celebrations-michael-pdf-buttons-once.yml'
permissions:
  contents: read
concurrency:
  group: celebrations-visual-official-publish
  cancel-in-progress: false
jobs:
  pdf-display-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: celebrations-staging
    env:
      PDF_BUTTONS_MODE: ${{ contains(github.event.head_commit.message, '[APPLY_PDF_BUTTONS]') && 'apply' || 'audit' }}
      PDF_BUTTONS_OWNER_APPROVED: 'yes'
      STAGING_R2_BUCKET: celebrations-exit-staging
      STAGING_R2_ACCESS_KEY_ID: ${{ secrets.CELEBRATIONS_STAGING_R2_ACCESS_KEY_ID }}
      STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.CELEBRATIONS_STAGING_R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Valider syntaxe sans changer le code du site
        run: python -m py_compile scripts/michael-external-pdf-buttons-once.py
      - name: Installer le client de stockage uniquement sur le runner
        run: python -m pip -q install boto3==1.40.57
      - name: Inventorier puis, uniquement si approuvé, convertir les aperçus PDF en boutons
        run: python scripts/michael-external-pdf-buttons-once.py
