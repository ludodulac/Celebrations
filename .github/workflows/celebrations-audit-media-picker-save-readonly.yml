name: Célébrations — audit lecture seule fichiers et publication
on:
  push:
    branches: [audit/celebrations-media-picker-saves-20261106]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: celebrations-staging
    env:
      STAGING_R2_BUCKET: celebrations-exit-staging
      STAGING_R2_ACCESS_KEY_ID: ${{ secrets.CELEBRATIONS_STAGING_R2_ACCESS_KEY_ID }}
      STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.CELEBRATIONS_STAGING_R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Audit the real server state without reading private content to logs
        run: |
          python -m pip -q install boto3==1.40.57
          python scripts/audit-media-picker-save-readonly-20261106.py
