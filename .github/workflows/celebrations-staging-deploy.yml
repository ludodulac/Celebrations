name: Celebrations Cloudflare staging deployment
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY_STAGING
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: celebrations-staging-only
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && inputs.confirm == 'DEPLOY_STAGING' }}
    runs-on: ubuntu-latest
    environment: celebrations-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
      STAGING_ADMIN_HASH: ${{ secrets.CELEBRATIONS_STAGING_ADMIN_PASSWORD_HASH }}
      STAGING_ADMIN_SALT: ${{ secrets.CELEBRATIONS_STAGING_ADMIN_PASSWORD_SALT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated staging configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_D1_ID STAGING_R2_BUCKET STAGING_ADMIN_HASH STAGING_ADMIN_SALT; do
            if [[ -z "${!name:-}" ]]; then echo "Missing: $name"; exit 1; fi
          done
          [[ "$STAGING_R2_BUCKET" == "celebrations-exit-staging" ]] || exit 1
      - name: Prepare static assets
        run: python scripts/build_staging_assets.py
      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Prepare staging bindings
        run: python scripts/configure_staging_wrangler.py
      - name: Create isolated D1 tables
        working-directory: migration/cloudflare
        run: |
          npx wrangler d1 execute celebrations-exit-staging --remote --file celebrations-schema.sql
          npx wrangler d1 execute celebrations-exit-staging --remote --file media-acl.sql
      - name: Configure staging admin authentication secrets
        working-directory: migration/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          printf %s "$STAGING_ADMIN_HASH" | npx wrangler secret put ADMIN_PASSWORD_HASH --name celebrations-exit-staging
          printf %s "$STAGING_ADMIN_SALT" | npx wrangler secret put ADMIN_PASSWORD_SALT --name celebrations-exit-staging
      - name: Verify isolated Wrangler assets configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'name = "celebrations-exit-staging"' migration/cloudflare/wrangler.toml
          grep -Fq 'directory = "../../staging-public"' migration/cloudflare/wrangler.toml
          test -f staging-public/index.html
          test ! -d staging-public/node_modules
          echo 'Verified staging-only config and static assets directory.'
      - name: Deploy staging Worker
        working-directory: migration/cloudflare
        run: npx wrangler deploy --config wrangler.toml
