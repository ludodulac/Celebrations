name: CELEBRATIONS D3 - inspect one historic public PDF cover reference (READ ONLY)
on:
  push:
    branches: [feat/celebrations-admin-visual-mission-d3]
    paths: [.github/workflows/celebrations-admin-d3-cover-read-once.yml]
permissions:
  contents: read
jobs:
  inspect-cover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: celebrations-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
    steps:
      - name: Inspect only the known public PDF record and cover field
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(process.env.STAGING_D1_ID,'0f761662-241f-42cc-ac94-5c68b4aa7797');
          assert.equal(process.env.STAGING_R2_BUCKET,'celebrations-exit-staging');
          const q="SELECT id,name,audience,has_cover,cover_storage_path,storage_path,source_type,content_type FROM celebrations_contents WHERE id='guide-file-30' LIMIT 1";
          const u='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database/'+process.env.STAGING_D1_ID+'/query';
          const r=await fetch(u,{method:'POST',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'},body:JSON.stringify({sql:q})});
          assert.equal(r.status,200,'Staging-only D1 inspection failed');
          const d=await r.json();assert.equal(d.success,true);
          const item=d.result[0]?.results?.[0];assert.ok(item);
          assert.equal(item.audience,'all','Do not log metadata of private content');
          const cover=item.cover_storage_path;
          const valid=typeof cover==='string'&&cover.length>0&&cover.length<1024&&!cover.startsWith('/')&&!cover.startsWith('committee/')&&!cover.split('/').some(p=>!p||p==='.'||p==='..');
          console.log('MISSION_D3_PUBLIC_PDF_COVER '+JSON.stringify({id:item.id,name:item.name,has_cover:item.has_cover,cover_storage_path:cover,cover_reference_valid:valid,primary_pdf_still_referenced:!!item.storage_path,source_type:item.source_type,content_type:item.content_type}));
          NODE
