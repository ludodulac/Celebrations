name: R2-023 sync safety tests
on:
  push:
    branches: [feat/r2-019-safe-preparation]
    paths:
      - scripts/r2_023_sync.py
      - tests/test_r2_023_sync.py
      - .github/workflows/r2-023-sync-tests.yml
  pull_request:
    paths:
      - scripts/r2_023_sync.py
      - tests/test_r2_023_sync.py
      - .github/workflows/r2-023-sync-tests.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'boto3>=1.35,<2' 'requests>=2.32,<3'
      - run: python -m unittest discover -s tests -p test_r2_023_sync.py -v
