name: Célébrations — isolated production Worker before DNS cutover
on:
  push:
    branches: [feat/celebrations-supabase-exit-001]
permissions:
  contents: read
concurrency:
  group: celebrations-isolated-production-worker
  cancel-in-progress: false
jobs:
  isolated-production-workers-dev:
    if: ${{ github.ref == 'refs/heads/feat/celebrations-supabase-exit-001' && contains(github.event.head_commit.message, '[ISOLATED_PROD_WORKER_ONCE]') }}
    runs-on: ubuntu-latest
    environment: celebrations-staging
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      CELEBRATIONS_ADMIN_PASSWORD: ${{ secrets.CELEBRATIONS_ADMIN_PASSWORD }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
      CELEBRATIONS_PROD_D1_ID: 28736d2a-479b-472b-bf82-703ad0affe10
      CELEBRATIONS_PROD_R2_BUCKET: celebrations-exit-production
      CELEBRATIONS_STAGING_D1_ID: 0f761662-241f-42cc-ac94-5c68b4aa7797
      CELEBRATIONS_STAGING_R2_BUCKET: celebrations-exit-staging
    steps:
      - name: Fail closed on wrong branch, missing credentials or mismatched resources
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/celebrations-supabase-exit-001"
          test "$STAGING_D1_ID" = "$CELEBRATIONS_STAGING_D1_ID"
          test "$STAGING_R2_BUCKET" = "$CELEBRATIONS_STAGING_R2_BUCKET"
          test "$CELEBRATIONS_PROD_D1_ID" != "$STAGING_D1_ID"
          test "$CELEBRATIONS_PROD_R2_BUCKET" != "$STAGING_R2_BUCKET"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#CELEBRATIONS_ADMIN_PASSWORD}" -ge 14
          echo "Isolated production Worker prerequisites verified; no official domain changes."
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure account-wide Cloudflare Free D1 quota is safe before any action
        run: node scripts/check-staging-d1-free-budget.mjs pre
      - name: Test source app, security and read-only isolation before any deployment
        run: |
          node --check migration/cloudflare/production-worker.mjs
          node --check scripts/verify_isolated_production_worker.mjs
          node --test tests/test-exit-production-candidate.mjs tests/test-exit-readonly-preview.mjs
      - name: Compile production site assets using existing verified conversion
        run: python scripts/build_production_assets.py
      - name: Generate exact separate production D1/R2 Wrangler config
        run: |
          python scripts/prepare_production_wrangler.py
          config=migration/cloudflare/wrangler.production.toml
          grep -Fx 'name = "celebrations-exit-production"' "$config"
          grep -Fx 'main = "production-worker.mjs"' "$config"
          grep -Fx 'workers_dev = true' "$config"
          grep -Fx 'preview_urls = false' "$config"
          grep -Fx 'run_worker_first = true' "$config"
          grep -Fx 'database_id = "28736d2a-479b-472b-bf82-703ad0affe10"' "$config"
          grep -Fx 'bucket_name = "celebrations-exit-production"' "$config"
          if grep -Eq '(^|[[:space:]])(route|routes|zone_id|custom_domain)[[:space:]]*=' "$config"; then
            echo "Forbidden official domain route present"; exit 1
          fi
      - name: Check isolated Worker presence safely (never overwrite)
        id: presence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/i.test(account))throw Error("Cloudflare account ID invalid");
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/celebrations-exit-production`,{
           headers:{Authorization:`Bearer ${token}`,Accept:"application/json"},signal:AbortSignal.timeout(25000)
          });
          if(r.status!==404&&r.status!==200)
           throw Error("Cloudflare script lookup unavailable; refusing write (HTTP "+r.status+")");
          const existing=r.status===200;
          await import("node:fs/promises").then(fs=>fs.appendFile(process.env.GITHUB_OUTPUT,
           "already_exists="+String(existing)+"\\n"));
          console.log("ISOLATED_WORKER_PRESENCE_CHECK existing_script="+existing+
           " safe_action="+(existing?"VERIFY_ONLY_NO_REDEPLOY":"FIRST_DEPLOY_ALLOWED"));
          NODE
      - name: Install pinned Wrangler package without paid plan
        if: steps.presence.outputs.already_exists == 'false'
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Deploy ONLY when absent, with protected derived admin secrets
        if: steps.presence.outputs.already_exists == 'false'
        shell: bash
        working-directory: migration/cloudflare
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          chmod 600 "$secret_file"
          trap 'rm -f "$secret_file"' EXIT
          python ../../scripts/make_admin_worker_secrets.py "$secret_file"
          npx wrangler deploy --config wrangler.production.toml --secrets-file "$secret_file"
      - name: Verify isolated candidate site and original official domain (GET/HEAD only)
        run: node scripts/verify_isolated_production_worker.mjs
      - name: Check account-wide Cloudflare Free quota again
        if: always()
        run: node scripts/check-staging-d1-free-budget.mjs post
