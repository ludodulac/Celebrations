name: "Célébrations M020-D — invitation, Brevo simulé et accès membre"
on:
  push:
    branches: [feat/m020d-member-auth-brevo-20261111]
  pull_request:
    branches: [feat/celebrations-m018-official-release-prep-20261111]
    paths:
      - 'migration/cloudflare/member-account-api.mjs'
      - 'migration/cloudflare/d1-migrations/20261111_020d_member_brevo.sql'
      - 'migration/cloudflare/auth-api.mjs'
      - 'migration/cloudflare/app/security/member-identity-links.mjs'
      - 'migration/cloudflare/app/security/member-admin-worker-routes.mjs'
      - 'migration/cloudflare/app/application/member-directory-admin-service.mjs'
      - 'migration/cloudflare/app/admin/member-directory-admin-integration.mjs'
      - 'migration/cloudflare/editor-trial-site-client.mjs'
      - 'tests/test_m020d_member_brevo.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax check (no Cloudflare, no Brevo calls)
        run: |
          node --check migration/cloudflare/member-account-api.mjs
          node --check migration/cloudflare/auth-api.mjs
          node --check migration/cloudflare/app/security/member-identity-links.mjs
          node --check migration/cloudflare/app/security/member-admin-worker-routes.mjs
          node --check migration/cloudflare/app/application/member-directory-admin-service.mjs
          node --check migration/cloudflare/app/admin/member-directory-admin-integration.mjs
          node --check migration/cloudflare/editor-trial-site-client.mjs
          node --check tests/test_m020d_member_brevo.mjs
      - name: Simulated Brevo + SQLite D1
        run: |
          node --test tests/test_m020d_member_brevo.mjs
      - name: Historical accounts and server security regressions
        run: |
          node --test \
            tests/test_m010a_explicit_private_identity.mjs \
            tests/test_m009b_member_identity_admin.mjs \
            tests/test_m011a_member_admin_worker_routes.mjs \
            tests/test_m018_final_functional_rules.mjs
      - name: No secret or deployment in this workflow
        run: |
          ! grep -E 'CLOUDFLARE_API_TOKEN|BREVO_API_KEY.*secrets|wrangler deploy' .github/workflows/celebrations-m020d-member-brevo.yml
