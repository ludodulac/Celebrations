name: "Célébrations M015 — audit Internet en lecture seule"
on:
  push:
    branches: [ops/celebrations-m015-online-audit-20261111]
permissions:
  contents: read
jobs:
  official-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Browser setup (no app deployment)
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Ordinary anonymous Chromium smoke — official root and www
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const cases=[
            ['official_root','https://ronde-des-archanges-universelle.eu/'],
            ['official_www','https://www.ronde-des-archanges-universelle.eu/'],
            ['official_admin_login','https://ronde-des-archanges-universelle.eu/admin'],
            ['official_publication','https://ronde-des-archanges-universelle.eu/api/editor-publication'],
            ['preprod_root','https://celebrations-m015-public-preprod.rondes.workers.dev/'],
            ['preprod_programme','https://celebrations-m015-public-preprod.rondes.workers.dev/programme'],
            ['preprod_preparation','https://celebrations-m015-public-preprod.rondes.workers.dev/preparation'],
            ['preprod_admin_denied','https://celebrations-m015-public-preprod.rondes.workers.dev/admin']
          ];
          for (const [label,url] of cases){
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[]; page.on('pageerror',e=>errors.push(e.message.slice(0,150)));
            try {
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
              const expected=label==='preprod_admin_denied'?404:(label.startsWith('preprod_')?200:null);
              if(expected!==null && response?.status()!==expected)
                throw new Error('Preproduction unexpected status '+response?.status()+' expected '+expected);
              if(label.startsWith('preprod_')&&errors.length)throw new Error('Preproduction browser JS error');
              console.log('LIVE_BROWSER '+JSON.stringify({
                label,http_status:response?.status()??null,
                final_host:new URL(page.url()).host,
                title:(await page.title()).slice(0,150),
                js_error_count:errors.length,
                first_js_errors:errors.slice(0,2)
              }));
            }catch(e){console.log('LIVE_BROWSER '+JSON.stringify({label,error:String(e).slice(0,180)}));}
            await page.close();
          }
          await browser.close();
          NODE
  cloudflare-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: celebrations-staging
    env:
      CF_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
    steps:
      - name: Read live Cloudflare deployments and binding names (never secrets)
        run: |
          node --input-type=module <<'NODE'
          const account=process.env.CF_ACCOUNT_ID,token=process.env.CF_API_TOKEN;
          if(!account || !token){
            console.log('CF_READONLY '+JSON.stringify({connection:'missing_credentials_in_environment',no_changes:true}));
            process.exit(0);
          }
          const base='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/workers/scripts/';
          for (const worker of ['celebrations-exit-production','celebrations']) {
            for (const part of ['deployments','settings']) {
              try {
                const response=await fetch(base+worker+'/'+part,{
                  headers:{authorization:'Bearer '+token,accept:'application/json'},
                  signal:AbortSignal.timeout(20000)
                });
                const data=await response.json().catch(()=>({}));
                const result=data.result??{};
                let report={worker,endpoint:part,http_status:response.status,api_success:data.success===true,no_changes:true};
                if(part==='deployments'){
                  report.deployments=(result.deployments??[]).slice(0,3).map(d=>({
                    id:d.id,created_on:d.created_on,
                    versions:(d.versions??[]).map(v=>({version_id:v.version_id,percentage:v.percentage}))
                  }));
                }else{
                  report.bindings=(result.bindings??[]).map(b=>({name:b.name,type:b.type}));
                  report.worker_compatibility_date=result.compatibility_date??null;
                }
                console.log('CF_READONLY '+JSON.stringify(report));
              }catch(e){
                console.log('CF_READONLY '+JSON.stringify({worker,endpoint:part,error:e.name||'error',no_changes:true}));
              }
            }
          }
          NODE

      - name: Inspect failing Workers Builds event via Cloudflare API (read-only)
        run: |
          node --input-type=module <<'NODE'
          const account=process.env.CF_ACCOUNT_ID,token=process.env.CF_API_TOKEN;
          if(!account||!token){console.log('CF_BUILDS {"error":"no_credentials"}');process.exit(0);}
          const base='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account);
          const id='424affef-bbf7-4b7e-8e03-4ff10f796181';
          const requests=[
            ['build',base+'/builds/builds/'+id],
            ['logs',base+'/builds/builds/'+id+'/logs'],
            ['d1-list',base+'/d1/database'],
            ['r2-list',base+'/r2/buckets']
          ];
          for(const [label,url] of requests){
            try{
              const res=await fetch(url,{headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(20000)});
              const d=await res.json().catch(()=>({})),x=d.result??{};
              const report={label,http_status:res.status,success:d.success===true};
              if(label==='build'){
                report.outcome=x.build_outcome??null;
                report.status=x.status??null;
                report.branch=x.build_trigger_metadata?.branch??null;
                report.build_command=x.build_trigger_metadata?.build_command??null;
                report.deploy_command=x.build_trigger_metadata?.deploy_command??null;
                report.root_dir=x.build_trigger_metadata?.root_directory??null;
              }else if(label==='logs'){
                const a=x.lines??[];
                report.log_lines=a.length;
                report.error_lines=a.map(v=>Array.isArray(v)?String(v.at(-1)):String(v))
                  .filter(v=>/error|failed|ENOENT|package.json|wrangler|not found|missing|cannot|invalid/i.test(v))
                  .slice(-12).map(v=>v.replace(/Bearer\s+\S+/g,'Bearer [REDACTED]')
                    .replace(/[A-Za-z0-9_-]{64,}/g,'[REDACTED]').slice(0,280));
                report.truncated=x.truncated??false;
              }else if(label==='d1-list'){
                const a=Array.isArray(x)?x:(x.databases??[]);
                report.resources=a.filter(v=>String(v.name).startsWith('celebrations-'))
                  .map(v=>({name:v.name,uuid:v.uuid})).slice(0,20);
              }else if(label==='r2-list'){
                const a=Array.isArray(x)?x:(x.buckets??[]);
                report.resources=a.filter(v=>String(v.name).startsWith('celebrations-'))
                  .map(v=>({name:v.name})).slice(0,20);
              }
              console.log('CF_BUILDS '+JSON.stringify(report));
            }catch(e){console.log('CF_BUILDS '+JSON.stringify({label,error:e.name||'network_error'}));}
          }
          NODE

      - name: Inspect new preproduction Worker reachability and security (read-only)
        run: |
          node --input-type=module <<'NODE'
          const base='https://celebrations-m015-public-preprod.rondes.workers.dev',u=base+'/';
          const account=process.env.CF_ACCOUNT_ID,token=process.env.CF_API_TOKEN;
          for(const [label,method,path] of [
            ['public','GET','/'],
            ['programme','GET','/programme'],
            ['admin_guard','GET','/admin'],
            ['draft_guard','GET','/api/editor-open-draft'],
            ['member_guard','GET','/api/admin/member-directory'],
            ['write_guard','POST','/api/editor-publication']]){
             try {
              const response=await fetch(base+path,{
                method,headers:method==='POST'?{'origin':base}:{},redirect:'manual',
                signal:AbortSignal.timeout(18000)
              });
              const errorText=response.status>=400?String(await response.text()).slice(0,140):null;
              console.log('PREPROD_AUDIT '+JSON.stringify({label,http_status:response.status,
                error_summary:errorText,
                content_type:response.headers.get('content-type'),
                noindex:response.headers.get('x-robots-tag'),
                server:response.headers.get('server'),
                location:response.headers.get('location')}));
             }catch(e){console.log('PREPROD_AUDIT '+JSON.stringify({label,error:e.name||'error'}));}
          }
          for(const path of ['settings','deployments','subdomain']){
            try {
              const res=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+
                '/workers/scripts/celebrations-m015-public-preprod/'+path,{
                headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)
              });
              const data=await res.json().catch(()=>({}));
              const result=data.result||{};
              console.log('PREPROD_CONFIG '+JSON.stringify({path,status:res.status,
                success:data.success,
                enabled:result.enabled??null,
                bindings:(result.bindings||[]).map(x=>({name:x.name,type:x.type})),
                deployments:(result.deployments||[]).slice(0,1).map(x=>({id:x.id,
                  versions:x.versions}))}));
            }catch(e){console.log('PREPROD_CONFIG '+JSON.stringify({path,error:e.name||'error'}));}
          }
          NODE