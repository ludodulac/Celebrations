name: Independent read-only Supabase R2 audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/independent-r2-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Install audit dependencies
        run: python -m pip install 'boto3>=1.35,<2' 'requests>=2.32,<3'
      - name: Independent full content verification
        shell: bash
        run: |
          python - <<'PY'
          import os, json, hashlib, tempfile, sys
          from urllib.parse import quote
          import requests, boto3
          from botocore.config import Config

          bucket = "celebrations-media"
          url = os.environ["SUPABASE_URL"].rstrip("/")
          session = requests.Session()
          session.headers.update({"apikey":os.environ["SUPABASE_SERVICE_ROLE_KEY"],"Authorization":"Bearer "+os.environ["SUPABASE_SERVICE_ROLE_KEY"]})
          r2 = boto3.client("s3",endpoint_url=os.environ["R2_ENDPOINT"].rstrip("/"),aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],region_name="auto",config=Config(retries={"max_attempts":5,"mode":"standard"}))
          source={}
          listing_requests=0
          def walk(prefix=""):
              global listing_requests
              offset=0
              while True:
                  response=session.post(f"{url}/storage/v1/object/list/{bucket}",json={"prefix":prefix,"limit":100,"offset":offset,"sortBy":{"column":"name","order":"asc"}},timeout=60)
                  response.raise_for_status()
                  listing_requests+=1
                  entries=response.json()
                  if not isinstance(entries,list):
                      raise RuntimeError("Unexpected source listing")
                  for item in entries:
                      name=item.get("name")
                      if not name or name==".emptyFolderPlaceholder":continue
                      path=prefix+name
                      if item.get("id") is None:
                          walk(path+"/")
                      else:
                          if path in source:raise RuntimeError("Duplicate source path")
                          size=(item.get("metadata") or {}).get("size")
                          if size is None:raise RuntimeError("Source size missing")
                          source[path]=int(size)
                  if len(entries)<100:break
                  offset+=len(entries)
          walk()
          dest={}
          paginator=r2.get_paginator("list_objects_v2")
          for page in paginator.paginate(Bucket=bucket):
              for item in page.get("Contents",[]):
                  path=item["Key"]
                  if path.startswith("_validation-r2/"):continue
                  dest[path]=int(item["Size"])
          missing=sorted(set(source)-set(dest))
          extra=sorted(set(dest)-set(source))
          size_mismatch=sorted(k for k in set(source)&set(dest) if source[k]!=dest[k])
          different=[]
          unreadable=[]
          verified=0
          for key in sorted(set(source)&set(dest)):
              if key in size_mismatch:continue
              try:
                  hs=hashlib.sha256()
                  count_s=0
                  with session.get(f"{url}/storage/v1/object/{bucket}/{quote(key,safe='/')}",stream=True,timeout=(30,180)) as response:
                      response.raise_for_status()
                      for chunk in response.iter_content(1024*1024):
                          if chunk:
                              count_s+=len(chunk)
                              hs.update(chunk)
                  hr=hashlib.sha256()
                  count_r=0
                  body=r2.get_object(Bucket=bucket,Key=key)["Body"]
                  try:
                      for chunk in body.iter_chunks(chunk_size=1024*1024):
                          if chunk:
                              count_r+=len(chunk)
                              hr.update(chunk)
                  finally:body.close()
                  if count_s!=source[key] or count_r!=dest[key] or hs.digest()!=hr.digest():
                      different.append(key)
                  else:verified+=1
              except Exception as e:
                  unreadable.append({"path":key,"error_type":type(e).__name__})
          report={"source_files":len(source),"source_bytes":sum(source.values()),"r2_files_excluding_validation":len(dest),"r2_bytes_excluding_validation":sum(dest.values()),"source_listing_requests":listing_requests,"sha256_verified":verified,"missing_files":missing,"r2_only_files":extra,"size_mismatch":size_mismatch,"different_files":different,"unverifiable_files":unreadable,"historical_count_delta":len(source)-158,"historical_bytes_delta":sum(source.values())-830312417}
          with open("r2-independent-audit.json","w",encoding="utf8") as f:json.dump(report,f,indent=2,ensure_ascii=False)
          print("AUDIT_SUMMARY "+json.dumps({k:(len(v) if isinstance(v,list) else v) for k,v in report.items()},sort_keys=True),flush=True)
          if missing or size_mismatch or different or unreadable or len(source)!=158 or sum(source.values())!=830312417:
              sys.exit(1)
          PY
      - name: Publish audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-r2-audit
          path: r2-independent-audit.json
          if-no-files-found: warn
