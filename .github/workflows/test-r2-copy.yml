name: R2 copy unit tests
on:
  push:
    branches:
      - chore/r2-copy-celebrations-20261012
  pull_request:
    paths:
      - scripts/copy_supabase_media_to_r2.py
      - tests/test_copy_supabase_media_to_r2.py
      - .github/workflows/test-r2-copy.yml
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'boto3>=1.35,<2' 'requests>=2.32,<3'
      - run: python -m unittest discover -s tests -p 'test_copy_supabase_media_to_r2.py' -v
