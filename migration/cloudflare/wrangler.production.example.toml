# CÉLÉBRATIONS — PRODUCTION CANDIDATE, NEVER DEPLOY THIS TEMPLATE.
# Create a dedicated D1 database + PRIVATE R2 bucket before using a generated
# configuration. The original GitHub Pages site remains the rollback target.
# Real values are never committed into GitHub.
name = "celebrations-exit-production"
main = "production-worker.mjs"
compatibility_date = "2026-10-16"
workers_dev = true

[assets]
directory = "../../production-public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/admin.html", "/admin"]

