# database_id = "<NEW_SEPARATE_PRODUCTION_D1_UUID>"
# [[d1_databases]]
# binding = "MEDIA_ACL"
# database_name = "celebrations-exit-production"
# database_id = "<NEW_SEPARATE_PRODUCTION_D1_UUID>"
