name: CÉLÉBRATIONS M13 — CSS modulaire et parité stricte
on:
  push:
    branches: [refactor/celebrations-mission-13-css-modules-20261108]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrats CSS octet pour octet + régressions M05 à M12
        run: |
          node --check migration/cloudflare/editor-demo-style.mjs
          node --check migration/cloudflare/editor-trial-site-client.mjs
          node --check migration/cloudflare/editor-demo-preparation-page.mjs
          for file in migration/cloudflare/app/styles/admin/*.mjs migration/cloudflare/app/styles/public/*.mjs; do node --check "$file"; done
          node --test \
            tests/test_mission13_styles.mjs \
            tests/test_mission12_public_renderer.mjs \
            tests/test_mission11_drag_undo.mjs \
            tests/test_mission10_safe_persistence.mjs \
            tests/test_mission09_page_lifecycle.mjs \
            tests/test_mission08_media_catalogue.mjs \
            tests/test_mission07_block_model.mjs \
            tests/test_mission06_editor_modules.mjs \
            tests/test_mission05_editor_composition.mjs \
            tests/test-editor-trial-site.mjs \
            tests/test-editor-demo.mjs \
            tests/test-editor-section-presentation-step3.mjs \
            tests/test-editor-multiple-button-links.mjs \
            tests/test-editor-presentation-server-roundtrip-step4.mjs \
            tests/test-editor-michael-preparation-layout.mjs \
            tests/test-editor-server-drafts.mjs \
            tests/test-editor-publication-media.mjs \
            tests/test-editor-modal-page-video-fixes.mjs \
            tests/test-editor-undo-video-media.mjs \
            tests/test-editor-celebration-themes.mjs \
            tests/test-editor-access-gate.mjs
      - name: Chromium desktop/mobile — administration, visiteurs, modales, DnD, Undo
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
          node scripts/mission02-editor-reference-browser.mjs
          node scripts/test-editor-media-picker-browser.mjs
          node scripts/mission11-drag-undo-browser.mjs
          node scripts/mission12-public-visitor-browser.mjs
          node scripts/mission13-style-browser.mjs
      - name: Captures modales et CSS à examiner avant publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celebrations-m13-css-parity-${{ github.run_number }}
          path: |
            artifacts/mission02/editor-fixture/
            artifacts/mission13/style-fixture/
          retention-days: 14
          if-no-files-found: warn
