name: CELEBRATIONS D4 RESTORE - staged access (one QA credential)
on:
  push:
    branches: [feat/celebrations-admin-visual-mission-e2a-access]
    paths: [.github/workflows/celebrations-admin-d4-restore-once.yml]
permissions:
  contents: read
concurrency:
  group: celebrations-staging-only
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    environment: celebrations-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CELEBRATIONS_STAGING_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CELEBRATIONS_STAGING_CF_ACCOUNT_ID }}
      STAGING_D1_ID: ${{ vars.CELEBRATIONS_STAGING_D1_ID }}
      STAGING_R2_BUCKET: ${{ vars.CELEBRATIONS_STAGING_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test existing D4 authorization and direct editor return on fictional data
        run: |
          set -euo pipefail
          test "$STAGING_D1_ID" = 0f761662-241f-42cc-ac94-5c68b4aa7797
          test "$STAGING_R2_BUCKET" = celebrations-exit-staging
          node --check migration/cloudflare/editor-d4-access.mjs
          node --check migration/cloudflare/staging-worker.mjs
          node --check scripts/verify-editor-d4-restored-once.mjs
          node --test tests/test-editor-d4-access.mjs tests/test-editor-e2a-access.mjs tests/test-editor-d-preview.mjs tests/test-editor-e1.mjs
      - name: Inspect existing D4 binding BEFORE touching staging - fail closed
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/celebrations-exit-staging/settings';
          const r=await fetch(endpoint,{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
          assert.equal(r.status,200);
          const obj=await r.json();assert.equal(obj.success,true);
          const b=obj.result.bindings;
          assert.deepEqual(b.filter(v=>v.type==='d1').map(v=>v.name).sort(),['DB','MEDIA_ACL']);
          assert.ok(b.filter(v=>v.type==='d1').every(v=>(v.database_id||v.id)==='0f761662-241f-42cc-ac94-5c68b4aa7797'));
          assert.deepEqual(b.filter(v=>v.type==='r2_bucket').map(v=>v.bucket_name),['celebrations-exit-staging']);
          assert.equal(b.filter(v=>['service','dispatch_namespace'].includes(v.type)).length,0);
          assert.ok(b.some(v=>v.name==='ADMIN_D4_ACCESS_HASH'&&v.type==='secret_text'),'D4 personal secret unavailable: STOP before changes');
          assert.ok(b.some(v=>v.name==='EDITOR_D_PREVIEW_TOKEN'&&v.type==='secret_text'),'Preview authentication binding unavailable: STOP before changes');
          console.log('D4_RESTORE_PERSONAL_SECRET_PRESENT and expiry_policy_unchanged=true');
          NODE
      - name: D1 daily quota check before staging QA login
        run: node scripts/check-staging-d1-free-budget.mjs pre
      - name: Build 94 staging assets before Wrangler (existing proven fix)
        run: |
          set -euo pipefail
          python scripts/build_staging_assets.py
          test -s staging-public/index.html
          test -s staging-public/admin.html
          python scripts/configure_staging_wrangler.py
          npm install --no-save --no-package-lock playwright@1.58.2 wrangler@4
          npx playwright install --with-deps chromium
      - name: Restore D4 with ephemeral QA test only - no new personal password
        run: node scripts/verify-editor-d4-restored-once.mjs
      - name: Verify historical blocks and no publication (read only)
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database/'+process.env.STAGING_D1_ID+'/query';
          const sql="SELECT (SELECT COUNT(*) FROM editor_c_imports) AS pages, (SELECT COUNT(*) FROM editor_b_pages WHERE published_version IS NOT NULL) AS published, (SELECT COUNT(*) FROM editor_c_blocks b JOIN editor_b_pages p ON b.page_id=p.id AND b.version=p.draft_version) AS blocks";
          const r=await fetch(url,{method:'POST',headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'},body:JSON.stringify({sql})});
          assert.equal(r.status,200);const data=await r.json();assert.equal(data.success,true);
          const row=data.result[0].results[0];assert.deepEqual([row.pages,row.blocks,row.published],[47,327,0]);
          console.log('D4_RESTORE_HISTORICAL_PASS pages=47 blocks=327 published=0');
          NODE
      - name: D1 Free plan quota post-check
        if: always()
        run: node scripts/check-staging-d1-free-budget.mjs post
