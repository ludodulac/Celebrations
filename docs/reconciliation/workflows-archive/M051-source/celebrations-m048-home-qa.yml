name: "M048 — accueil responsive et images"
on:
  push:
    branches: [feat/m048-responsive-home-art-20261116]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  home-responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Source parity and parse
        run: |
          node scripts/build-m019-editor-client.mjs --check
          node --check migration/cloudflare/editor-demo-client.mjs
          node --check migration/cloudflare/editor-trial-site-client.mjs
          node --check migration/cloudflare/editor-publication-api.mjs
      - name: Home, publication, security and previous feature tests
        run: |
          node --test \
            tests/test_m048_responsive_home.mjs \
            tests/test_m047_document_download.mjs \
            tests/test_m046_media_libraries.mjs \
            tests/test_m045_admin_collaboration.mjs \
            tests/test_m035_welcome_home_button.mjs \
            tests/test_m032_standalone_public_media.mjs \
            tests/test_m012c_private_editor_publication.mjs \
            tests/test_m041_audio_types_and_seek.mjs
      - name: Build desktop/mobile assets without deployment
        run: |
          python scripts/build_production_assets.py
          test -s production-public/assets/home/automne-ordinateur.webp
          test -s production-public/assets/home/automne-telephone.webp
