name: "M039 — décodage intégral des MP3 officiels"
on:
  push:
    branches: [fix/m038-audio-android-library-20261114]
permissions: {contents: read}
jobs:
  full-decode:
    if: ${{ contains(github.event.head_commit.message, '[M039_FULL_DECODE]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install FFmpeg decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download and decode complete 38 official MP3 files
        run: node scripts/test-m039-full-mp3-decode.mjs
